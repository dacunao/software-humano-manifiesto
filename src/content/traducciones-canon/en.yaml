  verificacion-02:
    sourceHash: c4ebb46b239ed3d84aa9c0584a4ce849e1833686213240ed5973932f6087ea1f
    state: aprobada
    text: "### Tests for accepting a solution"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-03:
    sourceHash: de064f7355755f1eacf1f92902aa3b109c4355cc21af6a479f765c159a95237b
    state: aprobada
    text: Acceptance must produce evidence. The impression that a screen looks clean, or that the code compiles, does not demonstrate that the product fulfils its purpose.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-04:
    sourceHash: 6143ba8260990d15952e5aec301eab0dabe1f6b867914646edac33da51421934
    state: aprobada
    text: |-
      | **Dimension**       | **Acceptance evidence**                                                                                                                                          |
      |---------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|
      | `V01` Coverage      | Every mandatory element of the product definition has an implementation and evidence, or an explicit and approved exception.                                      |
      | `V02` Progress      | People achieve the defined outcomes and can recognise them; where Job Stories exist, this is verified in their circumstances.                                     |
      | `V03` Causality     | The evidence relates the situation, the need and the outcome without depending on a feature request; where it applies, it preserves circumstance and motivation.  |
      | `V04` Understanding | They can explain where they are, what they can do and what will happen next, without outside help.                                                                |
      | `V05` Burden        | They do not face decisions, concepts or data that the system could resolve safely.                                                                                |
      | `V06` Depth         | The beginner finds a clear route and the advanced user retains sufficient capability.                                                                             |
      | `V07` Trust         | The system anticipates consequences, confirms results and offers proportionate recovery.                                                                          |
      | `V08` Control       | The person can review, correct, reject or revert according to the impact of the action.                                                                           |
      | `V09` States        | Loading, empty, error, success, interruption and return all preserve context and orientation.                                                                     |
      | `V10` Accessibility | The flow works with keyboard, visible focus, understandable labels, contrast and the applicable assistive technologies.                                           |
      | `V11` Performance   | Critical actions meet the response budget or show honest progress.                                                                                                |
      | `V12` AI            | Variable outputs declare uncertainty; critical rules are verifiable; sensitive actions require authorisation.                                                     |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  sh-score:
    sourceHash: 5f6d9ca58183faeb94944952ade4bbe985bc6ce5e82002aabb3f332023b747c4
    state: aprobada
    text: "#### Decision scorecard · `SH-SCORE`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-06:
    sourceHash: 2a9d9431c1fb343636571975397596ec290f9c9dd56c195fe28a45d4bc4343ad
    state: aprobada
    text: Assign 0 where there is no evidence, 1 where compliance is partial or depends on an unvalidated assumption, and 2 where there is sufficient evidence. The score guides the conversation; it does not replace judgement.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-07:
    sourceHash: 3be4be58556fdc26c74ef3e871fe560c7dcd44846e667174288e74a8646c1e5c
    state: aprobada
    text: |-
      | **Criterion**            | **Score** | **Evidence question**                                                                  |
      |--------------------------|-----------|----------------------------------------------------------------------------------------|
      | Traceable foundation     | 0 / 1 / 2 | Sources, authority, scope, results and conditions are identifiable                     |
      | Product coverage         | 0 / 1 / 2 | Every mandatory element has implementation, a test or an approved exception            |
      | Applicable Job Stories   | 0 / 1 / 2 | Where they exist, circumstance, motivation and outcome retain sufficient evidence      |
      | User progress            | 0 / 1 / 2 | The implementation produces the outcomes defined by the product                        |
      | Cognitive load           | 0 / 1 / 2 | It reduces or justifies concepts, decisions and steps                                  |
      | Interface clarity        | 0 / 1 / 2 | State, action and consequence are understood                                           |
      | Control and recovery     | 0 / 1 / 2 | Proportionate review, correction or reversibility exists                               |
      | Progressive depth        | 0 / 1 / 2 | Capability appears when it is appropriate                                              |
      | Dependability and timing | 0 / 1 / 2 | Performance, persistence and feedback meet expectations                                |
      | Responsible use of AI    | 0 / 1 / 2 | Uncertainty, limits and determinism have been resolved                                 |
      | Cumulative quality       | 0 / 1 / 2 | States, language and micro-interactions are coherent                                   |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-08:
    sourceHash: d06237e03cd0a0f6b06acbc859fa50a03830c1e0fc9c666cc31d26ce06f5f8ad
    state: aprobada
    text: Recommended exit criterion. No critical dimension may score 0. Criteria relating to security, permissions, money, personal data or irreversible actions must score 2 before release. For the rest, the team must define its threshold according to risk and scope.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-09:
    sourceHash: 0cf54551b2185b081e9afd1a31c037f3ad2e9bd0d67ec2d7161c373737ebdc72
    state: aprobada
    text: "#### Questions for a product review"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  verificacion-10:
    sourceHash: 5c925ea6ef9439ef96f6a79ecb252fdcec5b5f0e63a8ca5d19a210ee812c8a2b
    state: aprobada
    text: |-
      - What authorised source and what product foundation justify this decision?

      - Do the implementation and its tests account for the full scope?

      - Where Jobs to Be Done or Job Stories exist, how does this decision relate to them?

      - Does the formulation describe a need, or is it a feature request recast in another form?

      - What cognitive load does it introduce and what does it remove?

      - Are we exposing internal complexity?

      - Can any element be removed without reducing capability or control?

      - Does the person know what will happen before acting?

      - Can they recover easily if they make a mistake or if the system fails?

      - Is the AI proposing, deciding or executing? Is that level authorised?

      - What would make us reject this implementation even though it technically works?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
