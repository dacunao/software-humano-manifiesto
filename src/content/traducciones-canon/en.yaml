    sourceHash: eb849c4fa5b06ec805ed6a8c3f2d76fd5dbb1f299dda4454f501c27979ae42d1
    state: aprobada
    text: "#### Seven reasons to stop an implementation"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  guia-de-bolsillo-18:
    sourceHash: 169277b12fd84a1481a4654939d27c5a3a997c7160dd6b0e7b94e975968be358
    state: aprobada
    text: |-
      - `STOP01` There is no identifiable product foundation, or the solution appears to precede the problem.

      - `STOP02` The plan does not account for the whole mandatory scope defined by product.

      - `STOP03` There is an intention to omit, modify or defer a part without an authorised decision.

      - `STOP04` A material ambiguity is being resolved by the agent without authorisation.

      - `STOP05` The interface exposes internal complexity that the system could absorb.

      - `STOP06` A sensitive action lacks determinism, traceability or recovery.

      - `STOP07` The team can only demonstrate that the code works, not that the user makes progress.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
