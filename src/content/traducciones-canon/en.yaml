  sh-index:
    sourceHash: ba109314dbdc3ddf35668d25498f88d4608ae77ffe14ee0f26f515ae348b5ae9
    state: aprobada
    text: "## OPERATIONAL INDEX FOR AGENTS · `SH-INDEX`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  indice-operativo-para-agentes-02:
    sourceHash: 05b5a020d6b10f738d5d1914557cd9a77a4369d0715de427b4173d4b34f47113
    state: aprobada
    text: "This navigation layer lets people, agents and adapters cite core obligations in a stable way. The identifiers add no doctrine, priority, stages, artefacts or criteria: they only point to content that has already been approved. A reference by identifier never replaces reading the passage cited, nor does it modify the authority of the text."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  indice-operativo-para-agentes-03:
    sourceHash: 621ba255f3ab2920f767f1c87bc0448125934fc43685be2c278a64e0caab1c1d
    state: aprobada
    text: |-
      | **Family** | **Identifiers** | **Content** |
      |---|---|---|
      | Navigation | `SH-INDEX` | Operational index and rule for using identifiers |
      | Principles | `P01`–`P10` | Ten commitments that govern decisions |
      | Foundation | `SH-FUND` | Product definition, authority, scope and reference Job Stories |
      | AI directives | `D01`–`D06` | Doctrine for teams and agents |
      | Flow | `F01`–`F08` | Eight steps from the foundation to verification |
      | Artefacts | `A01`–`A08` | Eight documentary answers matched to context |
      | Stop conditions | `SH-STOP`, `STOP01`–`STOP07` | Conditions that prevent proceeding or accepting |
      | Agent contract | `CR01`–`CR08` | Reusable instructions for development |
      | Agent output | `O01`–`O09` | Expected content of results in natural language |
      | Verification | `V01`–`V12` | Dimensions of evidence for accepting a solution |
      | Cross-cutting controls | `SH-SCORE`, `SH-AP`, `SH-GOV`, `SH-DONE`, `SH-POCKET` | Decision, anti-patterns, governance, done and short guide |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  indice-operativo-para-agentes-04:
    sourceHash: 44d6e04f4c3f81e1c7401297481cbd42c56f054c1edccdaae582ac169bcd4b6f
    state: aprobada
    text: Adapters may indicate which identifiers require attention in a particular operation. That selection guides what is loaded and does not authorise ignoring any other provision of the core that applies by reason of context, risk or contradiction.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-01:
    sourceHash: 6bab92148942920f1847d4e2365dac28d0a6fea03349ba27611613e103392796
    state: aprobada
    text: "## PURPOSE OF THIS DOCUMENT"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-02:
    sourceHash: 98d1a37a5b203af175c6267cc8646808a71e0fcad41d76c1c988142389f4f435
    state: aprobada
    text: "### The problem this manifesto sets out to solve"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-03:
    sourceHash: c4614147aa90889d4c77982c0278c0facb598be13c83c4aad152b2e8b5f7860d
    state: aprobada
    text: How do we build software that amplifies people's capacity to achieve what they seek, without transferring the complexity of the technology to them?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-04:
    sourceHash: b8cb5d718ce987d21badbe63495690b4fc2b2094ae65831a27a77b83d7e70f8d
    state: aprobada
    text: "Software gains capability quickly. Artificial intelligence accelerates that process further: today it is cheap to generate screens, options, automations and layers of abstraction. That abundance does not guarantee a better product. It also makes it possible to turn a weak decision into a great deal of correct code, and an unnecessary idea into a finished feature."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-05:
    sourceHash: aec9b16cfdc70cb361b965286200abcf61507ee7b2921f319c87a4833e9c18b6
    state: aprobada
    text: This manifesto establishes a doctrine for deciding what deserves to be built, how it should feel to use, and what evidence must exist before an implementation is accepted. Its unit of measurement is not the number of features delivered. It is the progress a person can achieve with clarity, trust and control.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-06:
    sourceHash: 90484fc6184b9235a873e76a90edb33b8acfa5c698443b4f295386665bd73c10
    state: aprobada
    text: Version 2.1 preserves the concreteness reached through Jobs to Be Done and Job Stories, and extends the framework's capacity to work with product definitions of differing length and depth. A Job Story remains a particularly useful way to describe the circumstance that triggers a need, the motivation that drives action and the outcome being sought. The foundation of a development effort, however, may also be expressed through epics, capabilities, requirements, rules, journeys, criteria or other coherent structures. The format of the input must not force the product's intent to be distorted.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-07:
    sourceHash: aeab38e8b33bdf9d5a7fd873d96215cf6199019cc242bedd715ad22d07f38a44
    state: aprobada
    text: "#### The central conclusion"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-08:
    sourceHash: 447a1bffb732d740b177c91621d15040209dbd0055710ddce5b4e74001add276
    state: aprobada
    text: Function establishes what the software makes possible. Experience determines how much of that capability a person can actually put to use.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-09:
    sourceHash: 27ac52e2d651c68cbb541c17c268b3a140c190950cd5f49509919a9fc3342004
    state: aprobada
    text: Experience is not an aesthetic layer added once the functionality has been solved. It is part of it. If a solution produces the correct result but requires the user to decipher the interface, remember unnecessary rules or fear making a mistake, the solution is still incomplete.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-10:
    sourceHash: 4435ded4c50c7b6fe4a8b32bdaf3da8ac11a77a6dde5ad5559c4560fb9bdd415
    state: aprobada
    text: "#### Scope and readers"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-11:
    sourceHash: 92191be9b407dc6dc1114f8fbffe6906852e56fdb5df9e71cff7405ddd07f215
    state: aprobada
    text: "The framework applies to products where the user experience directly influences the outcome: web and mobile applications, internal tools, learning systems, digital services, agent-enabled products and AI-assisted solutions. It is addressed to product managers, designers, developers and coding agents who take part in product decisions."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-12:
    sourceHash: 89f624aacb21a1c574f506cdfabf79cad4a2a536dba0f5f02b1eb7c4fa94b552
    state: aprobada
    text: It does not prescribe a visual style, a technology, a PRD structure, a delivery strategy or an engineering framework. Neither does it remove the real complexity of the domain. It defines how to prevent the system's internal structure from becoming, for the team's convenience, additional work for the person using it.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-13:
    sourceHash: 63661449d40a338ea773823815cab21effc6e6c1ac65c4cff5f29796297ddec5
    state: aprobada
    text: This document contains the core of the manifesto. Translating it into specification-driven development methods and into particular frameworks must be done through separate annexes or adapters. No implementation may reduce its principles, alter the scope defined by product, or attribute to the agent an authority that the core reserves for people.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-14:
    sourceHash: 6a258fb61101e2edd07b18cc3c5eaf77fd9a0e3a9ebb1ad0cbd24eba587c2ca3
    state: aprobada
    text: "#### How to use this document"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-15:
    sourceHash: 65b0dc5c03c85f8b07e3f235b3c858acba4ae9fc63c928c35d3e9e44fdab5e60
    state: aprobada
    text: The document offers two depths of reading. The first makes the stance understandable in a few minutes. The second turns that stance into verifiable decisions during development.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-16:
    sourceHash: 6adbbd4c9722ae1ccc6c83cbe840381699dea65c944624b9332f2045936cf206
    state: aprobada
    text: |-
      | **Route**   | **Content**                                                                        | **Recommended use**                               |
      |-------------|------------------------------------------------------------------------------------|---------------------------------------------------|
      | Understand  | Thesis and canonical text of the manifesto                                          | Align the team before defining a solution         |
      | Decide      | Ten principles, product foundation and Job Stories with rules and control questions | Decide between product and UX alternatives              |
      | Build       | Doctrine specific to development with AI                                            | Guide coding agents and human reviewers           |
      | Verify      | Acceptance tests, scorecard and anti-patterns                                       | Evaluate prototypes, implementations and deliveries |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-17:
    sourceHash: 31020a49bf19f87e006aa13d8daf1a45285cf1a58fd2525977a3e45806e3554d
    state: aprobada
    text: "#### The architecture of the framework"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-18:
    sourceHash: ddeb8cf39801855179dc9086bfc4d295351ccca7ee7fa6dfb458cf6bd4e02d3d
    state: aprobada
    text: Each principle is expressed at several operational levels. No level replaces another. The product foundation preserves the authorised definition of what must be built and why. Jobs to Be Done can orient progress in general terms, and the Job Story offers this manifesto's reference form for making that progress concrete, situated and verifiable.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-19:
    sourceHash: a22be2460e71b4eb75e97b94d66d076b91d99bbca3aca7a97835074ce1e70faa
    state: aprobada
    text: |-
      | **Level**               | **Question it answers**                                     | **Result**                                          |
      |-------------------------|-------------------------------------------------------------|-----------------------------------------------------|
      | Principle               | What we believe                                              | A stable criterion for orienting decisions          |
      | Product foundation      | What must be built, why and under what conditions            | An authorised, traceable and verifiable base        |
      | Reference Job Story     | When a need arises and what progress the person is after     | A concrete form for designing and verifying         |
      | Rule                    | What it demands when designing or implementing               | An observable behaviour of the product and the team |
      | Test                    | How we know whether we have met it                           | Evidence that allows accepting, revising or rejecting |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-20:
    sourceHash: 84b864a4736f616a8af387c372722f41e8bb56e713830a3a6ad9e56ea299558e
    state: aprobada
    text: "#### The boundary between core and implementation"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  proposito-del-documento-21:
    sourceHash: f45ddc8e9fe6fe13af8d7c5486dbd32048118cc92aaf36c3689896c7dedce7b8
    state: aprobada
    text: The core defines principles, authorities, traceability conditions, acceptance criteria and limits for teams and agents. A general annex may translate these obligations into a specification-driven development method. Adapters for particular frameworks must resolve commands, templates, flows, persistence and compatibility without modifying the core. A change of framework does not in itself constitute a new version of the manifesto.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-01:
    sourceHash: 3a1c6c4b693b3d050bfd80300dcf4fb6d937c5be796f7d273c6c9b6705efe68e
    state: aprobada
    text: "## CANONICAL TEXT"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-02:
    sourceHash: 24844e6a6b5642d10b55636ee2426da231d2cd076821411bbd15e91d4b9dcb07
    state: aprobada
    text: "### Manifesto for human software development"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-03:
    sourceHash: 738e225c7bf9e2eb2d8def05b636a29468a050950a1a68417dd8b8fe20bab336
    state: aprobada
    text: The purpose of software is to extend what a person can do.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-04:
    sourceHash: e7e802c73362f16ebd7b5d0293bd9a4951d974b35663ef6c4e228489ad1fd1bc
    state: aprobada
    text: People do not come to our products in order to use features. They come because they want to understand, decide, create, learn, communicate, solve problems or move forward. That progress is our real product.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-05:
    sourceHash: 3f64c90522b83efcd226385e97169f244f56ce76a34404935903e1150530f4e0
    state: aprobada
    text: Progress does not happen in the abstract. It is triggered when a circumstance creates a need, a tension or a decision. Before designing a response we describe that circumstance, the motivation it produces and the outcome the person is seeking. The solution comes afterwards.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-06:
    sourceHash: 7423bf31e699bc0784adacb621526e0e91fac56fa82bf2181ceae5a676a6f4a5
    state: aprobada
    text: The product definition governs what must be built. It may be expressed as a single story or through an extensive PRD made up of stories, capabilities, rules, states, journeys and criteria. Development must understand that structure, preserve its meaning and account for its full scope. Breaking the work down, ordering it or running it in parallel does not authorise omitting or redefining it.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-07:
    sourceHash: e0f854b8f83d022990d5c2c278a0ad4a52f0092f68b3c280bc14e9aa48e7789b
    state: aprobada
    text: This is why experience is part of functionality. A system that lets someone complete a task but forces them to interpret the interface, remember conventions, work through unnecessary structures or wonder what will happen next, transfers to the user a problem the product should have solved.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-08:
    sourceHash: aaaac0e336bee0b98e3d77f08ea821f1e8a69e9cb00735b8c18c286564e96e7c
    state: aprobada
    text: We do not reject complexity. Many important problems are complex. What we reject is that the complexity of building them should automatically become complexity for whoever uses the tool.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-09:
    sourceHash: 3ee03fdccbab59a58f9bb54fd13862d810f86c6af7202925344ef083741e4aac
    state: aprobada
    text: We seek software that is simple to begin with and deep when needed. Software that reveals capabilities in context, explains without interrupting, anticipates without controlling and lets people recover without fear.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-10:
    sourceHash: 03d785667267259748ca26ced93a8d00d956ff02161f8a9856333b8fb4f07066
    state: aprobada
    text: Every element must justify the attention it consumes. Every interaction must help us understand where we are, what we can do and what will happen next. Every detail must contribute to an experience that is coherent, fast and dependable.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-11:
    sourceHash: 753b32ffda43ce959468d9f0125049a9317ff2dcccd93b94c4f6caa1d850b1ff
    state: aprobada
    text: Artificial intelligence must absorb complexity, not multiply it. It may propose, summarise and automate, but it remains subordinate to the person's intent. Critical rules, permissions, commitments and states that require certainty do not depend on a probabilistic interpretation.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-12:
    sourceHash: 4344d1121dea2b79a10b68bf1017bf30a816aa6fbceb5311990666dcc7fddf95
    state: aprobada
    text: Now that building is easier, our responsibility grows. Before adding a capability we ask what progress it enables, what burden it introduces, what risk it creates and whether it deserves to exist.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-13:
    sourceHash: 39b10c5773e6ad61cd4b4212bb829214bd4e05ddf4f0465f4d45f2050ee8b246
    state: aprobada
    text: Our aim is for sophistication to remain behind the experience, and for the person in front of it to retain their purpose, their attention and their control.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  texto-canonico-14:
    sourceHash: 4ec43bdfecbc77c1a006111d9cfb943b965a338d5b5d94ff8742be4cdc5c006e
    state: aprobada
    text: The best software does not make users admire the software. It makes them marvel at what they can now do.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principios-de-diseno-01:
    sourceHash: 1709fbf88ff80e2c7c937f6e13cfc00427f08352bf2d9ecceb67401fcf0b85ec
    state: aprobada
    text: "## DESIGN PRINCIPLES"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principios-de-diseno-02:
    sourceHash: a0b34f425e42273cad15a3b5ed1ef06582e9362a59cdfe09d870a08e62e09026
    state: aprobada
    text: "### Ten commitments that govern decisions"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principios-de-diseno-03:
    sourceHash: 9f2cb5d21dc2adfa17e45f97e188748300d91197f8bcd2d8ef87141a733a6d0a
    state: aprobada
    text: The principles do not describe decorative aspirations. Each one must be capable of changing a decision, stopping an implementation or requiring additional evidence. A sentence with no practical consequences serves no function within the framework.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principios-de-diseno-04:
    sourceHash: d9356c265d0964113c7470d95574878e867dbb5bf95296991c0f9261d0f7f745
    state: aprobada
    text: |-
      | **N** | **Principle**                                          | **Main consequence**                                                                                     |
      |-------|--------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
      | 1     | The user's progress is the unit of design              | Ties every decision to its product foundation and uses Job Stories when they express the situation better |
      | 2     | Experience is also functionality                       | Includes effort, emotion and friction in the definition of quality                                       |
      | 3     | Complexity belongs to the system                       | Avoids passing the internal model on to the user                                                         |
      | 4     | Simple to begin with, deep when needed                 | Reveals power in context without limiting the expert user                                                |
      | 5     | The interface must not become another task             | Reduces incidental learning and custom conventions                                                       |
      | 6     | Attention is a product resource                        | Justifies every element and every decision requested                                                     |
      | 7     | Trust is designed                                      | Makes state, consequences, control and recovery visible                                                  |
      | 8     | Quality lives in the accumulation of details           | Treats micro-decisions and edge states as part of the product                                            |
      | 9     | Time and continuity are part of the interface          | Integrates performance, availability and preservation of work                                            |
      | 10    | The person retains control and ownership               | Subordinates assistance and automation to human intent                                                   |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p01:
    sourceHash: 49945ca8af5f26de61dc59b4b13efc1693814fe17f77aa8bd80d046c9ff4a51b
    state: aprobada
    text: "## PRINCIPLE 1 · `P01`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-02:
    sourceHash: 23e0e959c84d28e502804a2d466f4a564e0503c783a4f0a23b14918ffde96d79
    state: aprobada
    text: "### The user's progress is the unit of design"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-03:
    sourceHash: 823b09af02b13002d3174c3bbe8fca5c5dbff156cd7b0ee4a38ac0d46cf449d6
    state: aprobada
    text: Do not design what the user can do. Design the progress they need to achieve.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-05:
    sourceHash: df1f8094eff0ef51d71d482e87415a08a8af7ea4108f3d38a4ae02e915905039
    state: aprobada
    text: A feature only makes sense if it helps a person move from a current situation to a desired outcome. The product foundation establishes the authorised reason for the development. Jobs to Be Done can define progress at a broad level, and the Job Story makes it operational by describing when the need arises, what motivates the person and what outcome they are seeking, without anticipating the solution.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-07:
    sourceHash: 84eaaa31b6ebe70a3fed2ffec9dd7fad87b8f2b0705e2996d0c208ad62f09be8
    state: aprobada
    text: "When work is organised around features or generic profiles, a team can deliver a great deal and resolve very little. A Job Story forces the causality to be spelled out: the circumstance that triggers the need, the tension that drives action, and the better situation that would make progress recognisable. When the product uses another form, that same causality must be preserved to the extent that it applies."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-09:
    sourceHash: f15c82c002db525e11977b227bb0fd94132fcfa56b30f6ea97b966a5292630e1
    state: aprobada
    text: |-
      - Identify the product foundation and the authorised source that establishes the scope before designing a response.

      - Where the foundation is expressed through Job Stories, place them within the higher-level progress or purpose to which they belong.

      - Formulate each Job Story as circumstance, motivation and outcome, without naming a screen, a component or a feature.

      - Ground decisions in observed behaviour, the current obstacle or anxiety, and evidence that supports acceptance of the outcome.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-11:
    sourceHash: 4dc689c52f99a3653bf80519499f42071f19df1e466534bb96713928b2df2719
    state: aprobada
    text: |-
      - Can the authorised source that justifies this decision be identified, together with its relationship to the full scope?

      - Where a Job Story exists, is the circumstance specific and observable, or does it merely describe a role?

      - Are the motivation and the outcome backed by evidence, or were they assumed by the team?

      - Does the formulation admit several possible solutions? If it already prescribes an interface without that being a product decision, it must be revisited.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-1-12:
    sourceHash: 8b4ca300eefcdf821d8992863ee2ae37160048ecaa577382e205800bb1e14ab1
    state: aprobada
    text: "**Sign of non-compliance.** “As a student, I want hints so I can solve derivatives” looks like a useful story, but it begins with a role and prescribes a function. It does not explain when the blockage arises, what the person needs to understand, or how to recognise that they have regained momentum."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p02:
    sourceHash: 96c5672433c781644116c282a77499775eade12f1cbb17cd355b80777c156f7b
    state: aprobada
    text: "## PRINCIPLE 2 · `P02`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-02:
    sourceHash: 21f2b77c67d4a23e5e45879302a158a713d12296f072fae1c1a4b3bfdcfbd4a5
    state: aprobada
    text: "### Experience is also functionality"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-03:
    sourceHash: 05e52489dad1d9828102025c546ef3a6b6534cfe70e49c5dc0c7c16af4c12407
    state: aprobada
    text: If it works but wears you down, it does not yet work well.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-05:
    sourceHash: 165246f816f2e393266c1f3f12f0c6fc6a48e8d727ff0e9ff3672adffe1cfef5
    state: aprobada
    text: A product is not defined solely by the accuracy of its output. How much effort, uncertainty and attention it demands in order to obtain that output also matters. Whether the experience feels fluid or frustrating alters a person's real capacity to complete their work.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-07:
    sourceHash: 75fa16cc10ff66698d3a3f2efd7cd5f3feb4450e5f6020781133e82b2c6a335a
    state: aprobada
    text: Two products can deliver the same result and yield different levels of performance. A burdensome experience causes abandonment, errors, dependence on support and loss of trust. That cost is functional, even though it does not appear in the technical specification.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-09:
    sourceHash: 7185b9b6e0d5d5526a1b3ba2a8056169e2ea145b25c8e9725f52fcc3926d5768
    state: aprobada
    text: |-
      - Include effort, clarity and trust within the acceptance criteria.

      - Test the complete flow, not just each screen or endpoint in isolation.

      - Consider the emotional and cognitive state that accompanies the situation defined by the product and, where one exists, by the Job Story.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-11:
    sourceHash: 002a91e8c121741c2058d3885d08f3e7056b74c6a92255c601031bf12dc40672
    state: aprobada
    text: |-
      - Can the person concentrate on their objective, or must they manage the tool?

      - Which moments provoke doubt, tension or interruption?

      - Does a task done correctly leave the user with energy to carry on?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-2-12:
    sourceHash: a1325171c5d7dbc584acaa26205feb56dce634729fc6cc13098d103c1c477445
    state: aprobada
    text: "**Sign of non-compliance.** A technically valid form that wipes the data after an error turns correction into punishment. The validation works; the experience does not."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p03:
    sourceHash: 8e9ffc20901ed8bff262a2b94df759999b968327a163c5913cc4c4de4cdbfad4
    state: aprobada
    text: "## PRINCIPLE 3 · `P03`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-02:
    sourceHash: f49b36c7193f14c8ca6b6ef519df2a74926fb531822bbc381acc5e17f340b53a
    state: aprobada
    text: "### Complexity belongs to the system"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-03:
    sourceHash: d7e8449e065157244cb9a11671af6af72368113adde7b48d0e0e79910b8b1e07
    state: aprobada
    text: Just because it is complex to build does not mean it must be complex to use.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-05:
    sourceHash: 7203c0a96f1895f649dd201ec31ce9671e64cbfa3b44257357c953ccdff38048
    state: aprobada
    text: The domain may require rules, integrations and exceptions. The team must absorb that complexity and present it as understandable decisions. Internal tables, states and services should not dictate the user's language or navigation.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-07:
    sourceHash: 2c59501004726163efb36946979a065daae9cdd1cac26e405a7bc6f1d4b015bf
    state: aprobada
    text: When the interface mirrors the architecture, the person has to learn how the product was built before getting any value from it. That transfer usually seems inevitable only because it is convenient for the team.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-09:
    sourceHash: 3307d7eb0456795d959ff3753c7d99bad6cb26e88fbddbdb5c49643a20cccec6
    state: aprobada
    text: |-
      - Translate internal concepts into the person's language and mental model.

      - Resolve dependencies, defaults and sequences where there is sufficient context.

      - Expose an exception only to those who genuinely have to decide it.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-11:
    sourceHash: 58b3d473f6faa77a79e490b974efb95b9a5232b9653457bcc1471d50eb12caab
    state: aprobada
    text: |-
      - Does this step exist because of a user need or because of the system's structure?

      - Are we showing a technical entity that could be translated or inferred?

      - Does the person need to understand this rule in order to make a good decision?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-3-12:
    sourceHash: 60d437da4f04bb09b9855d07fbcdf11885f7a821bcc52336e30588280e6c2107
    state: aprobada
    text: "**Sign of non-compliance.** Asking the user to first choose an internal record type, where that distinction has no meaning for them, exposes the data schema as though it were a human need."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p04:
    sourceHash: fe331a88aa7bce55b8e58e97e4b683da4b1ea6c69bea4571bb19bc7670a2b799
    state: aprobada
    text: "## PRINCIPLE 4 · `P04`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-02:
    sourceHash: 22c471699ffd3780d214edd9f440489a656fc2b03adfe41b90fbad6c96c10b29
    state: aprobada
    text: "### Simple to begin with, deep when needed"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-03:
    sourceHash: ebe153af092acf985156dae8241cc854b9497d1fbae58bf5368c0309d726128f
    state: aprobada
    text: Do not remove the power. Remove the obligation to face it before it is needed.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-05:
    sourceHash: e0340e53d0f0d36de411fab4f4fdbd8f65dfa905119a926cc63c1d6eeee69c91
    state: aprobada
    text: Simplicity does not consist of reducing the product's capability. It consists of matching what is visible to the moment, the level of experience and the decision at hand. Depth appears progressively and remains available.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-07:
    sourceHash: cdd5b44b42a62db92538425782a8d2d9b36787175e0a8d92f6ba79f17b39f4bb
    state: aprobada
    text: A minimalist product can feel easy on day one and limiting on day ten. A product that displays all of its power from the outset can be unapproachable. Progressive disclosure avoids both extremes.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-09:
    sourceHash: d825e70a034b3da4912e0918515e49c6ed45c1491a6d99f54273e7c4bbbed5af
    state: aprobada
    text: |-
      - Show the main route first and reveal advanced options when the context makes them relevant.

      - Preserve shortcuts and precision for expert users without imposing them on the beginner.

      - Use good defaults, always editable where the decision matters.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-11:
    sourceHash: 2cd6123fe100ece793528e622ab2a7e4b268e2257ca714816d0eace294acf130
    state: aprobada
    text: |-
      - What exactly does the person need to see in this state?

      - Does the simplification remove noise, or does it remove necessary capability?

      - Can an expert user move quickly without the beginner having to carry that depth?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-4-12:
    sourceHash: 4b15354c5c70e2142601e1edac9a1982aee120149f7226429314fd3d3724d7b9
    state: aprobada
    text: "**Sign of non-compliance.** Hiding every option can produce a clean first impression and a dead end when a less common case comes up."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p05:
    sourceHash: a883ee3f5e9b8b85015f3758b0c485655e4660075ec96599316f4e6e7f5b5700
    state: aprobada
    text: "## PRINCIPLE 5 · `P05`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-02:
    sourceHash: 8d4d344dd478fe89dc26fad2aed27153977ad9867859a5ecc959959c3250b736
    state: aprobada
    text: "### The interface must not become another task"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-03:
    sourceHash: 77fa3fff68c166492292475e8f57d669be8b5c474373ada2b4a0e88a4fe43175
    state: aprobada
    text: The person came to do their work, not to learn ours.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-05:
    sourceHash: 54b60739a477c58ddaaf9c6207c079b516d59e9148d0974cde53312024d85160
    state: aprobada
    text: An interface must build on familiar expectations, an understandable hierarchy and immediate feedback. Every custom convention the user has to memorise consumes capacity that should be spent on the real problem.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-07:
    sourceHash: 184cd186d363977ff3bcd8b1ad338e125ac29a8962037bb2370326b9201d172f
    state: aprobada
    text: The learning burden becomes especially damaging in educational, health, financial or infrequently used products. The person is already facing enough complexity in the content or in the decision.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-09:
    sourceHash: 6c6e3e6c1bd6d9607b1b9576e523b2c45851b3ce07285889b22db46d28517460
    state: aprobada
    text: |-
      - Prefer known conventions where they solve the problem well.

      - Explain in context, without requiring prior tutorials for basic actions.

      - Make the primary action, the current state and the next possible step evident.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-11:
    sourceHash: 692bfdd389d61d0e14a91cb759d7801b008e86557b44f05ab6bc75c461d2bf4b
    state: aprobada
    text: |-
      - Does the person understand what the elements mean without an external legend?

      - Do they need to remember something from a previous screen in order to act correctly?

      - Does the interface add a layer of learning unrelated to the situation or the outcome they have to resolve?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-5-12:
    sourceHash: b71a03e00d4199e31d32b9473e9d69ecdbd72a4bb8ed7cf8cd5d8e3d622832a3
    state: aprobada
    text: "**Sign of non-compliance.** A numbered sequence with no visible meaning forces people to learn the navigation at the same time as the content. The numbers organise things for the team, but they do not orient the user."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p06:
    sourceHash: 8b1c2da6bcbf7911b28a12f7824d7942204fbecd75c8e5a3e085a3ba8d4d4e8c
    state: aprobada
    text: "## PRINCIPLE 6 · `P06`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-02:
    sourceHash: ee4315ca32176036910ebc4de59eadb3b53fba8d65791917d14fc9ece6733035
    state: aprobada
    text: "### Attention is a product resource"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-03:
    sourceHash: 347b6047aa96f6b43cc62eff471401c555988a61f9ab1ec490ddbb5cf3a69be1
    state: aprobada
    text: Everything we show competes with what the person came to do.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-05:
    sourceHash: e8045a544fd72b5d7b8081cca7f62f85bba09e2316e2db84ba1c8562cd1fa5b3
    state: aprobada
    text: Attention is finite. Menus, alerts, animations, choices and text all demand a share of it. Design must manage that budget with the same discipline as performance or cost.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-07:
    sourceHash: 697f8e8110f9ed7f538fad23327868321fd1508b6211168e6e716291103c76d8
    state: aprobada
    text: An interface can be free of errors and still fail through saturation. Accumulated load degrades understanding, increases accidental decisions and makes simple tasks feel heavy.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-09:
    sourceHash: cd137243625d96195e8c4f461c11f13296d2251486973630de443127585506c4
    state: aprobada
    text: |-
      - Require every visible element and every decision requested to answer to a verifiable circumstance, motivation or outcome.

      - Establish hierarchy by relevance to the current state, not by giving every feature equal weight.

      - Reduce interruptions and reserve strong signals for matters that genuinely require attention.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-11:
    sourceHash: 01895d24a2d85178ebcbbe0960bcb5e16e010655d64de375bdc8bf51b5fed4f8
    state: aprobada
    text: |-
      - What competes visually or mentally with the primary action?

      - Can an element be removed without losing necessary information or control?

      - Does the interface distinguish the urgent, the important and the optional?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-6-12:
    sourceHash: 680b7599e2e2970f1ba0c397d849a38ed3e351893dfb1b2083005130c5c509fb
    state: aprobada
    text: "**Sign of non-compliance.** Presenting five actions with equal visual weight forces the user to establish a priority that the product should already know from context."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p07:
    sourceHash: b352795cc361844dcf699e8d53db4c43f4b97e9213086347f93e994b166f7dca
    state: aprobada
    text: "## PRINCIPLE 7 · `P07`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-02:
    sourceHash: b8d5eb5a6ea2a71eedfba34ac732df71b2e5b2934fa6cb0fd5f9fb95310ec5ba
    state: aprobada
    text: "### Trust is designed"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-03:
    sourceHash: ac65f1d9d88d4bc2fe5be6234703c1209678848ca95ef17fbf8d7946ff425c9d
    state: aprobada
    text: A good tool explains enough for the person to act without fear.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-05:
    sourceHash: 3a97b2f4126192dad181e1d032e0aeac6bdebb401769911ae0be0f63e6ff3a0d
    state: aprobada
    text: Trust arises when the product shows its state, anticipates consequences, confirms results and offers recovery. It does not rest on general promises, but on predictable behaviour.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-07:
    sourceHash: 8bdf13fd41c0c35754e378d2056c5508f27eac1a3148d493ebc2d44a5c2c2fa4
    state: aprobada
    text: Uncertainty holds action back. With AI, trust additionally requires distinguishing facts, inferences, proposals and actions already carried out. A fluent response cannot conceal its limits.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-09:
    sourceHash: 2bf2d13fbb699a0b505a42b105fa23feead2bb29351fd0aba10204c7944c7d0d
    state: aprobada
    text: |-
      - Show what is happening, what will change and when an action will be irreversible.

      - Allow people to undo, correct or return to a safe state where that is reasonable.

      - Clearly differentiate recommendations, automatic decisions and confirmed results.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-11:
    sourceHash: 64d26f5446d76c7a02fb3fbe7423d9c5c3bd3da05d4eb0377685da88c9a7f414
    state: aprobada
    text: |-
      - Does the person know what will happen before confirming?

      - Can they verify what the system did and why?

      - Is there a way to recover that is proportionate to the risk?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-7-12:
    sourceHash: 9894141c7e196e899150e7745d3ba62bf0f9d4b576f4e98e4bc6a9d0a4ba8578
    state: aprobada
    text: '**Sign of non-compliance.** An agent that reports "done" without showing what changed forces people to trust its tone rather than the evidence.'
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p08:
    sourceHash: c10361bfc710cfabf8b69ffa80a44cf0d69b69a668059cbe8f7b98bb376cc722
    state: aprobada
    text: "## PRINCIPLE 8 · `P08`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-02:
    sourceHash: bca9dd674b7c13b797ac205eb66385b5a3fb39b43c195addc960987f16277aeb
    state: aprobada
    text: "### Quality lives in the accumulation of details"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-03:
    sourceHash: 196b50c98693589f5941749c9d6f195c2f56a134d91ebb90aa2ce8ca539ba70f
    state: aprobada
    text: Quality rarely depends on one big decision. It is recognised in many small decisions that align with one another.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-05:
    sourceHash: ee66dd6f3aea2bd71216cf9b85729a2723fd1952a1d0c261261ea7d1eaf3fcf8
    state: aprobada
    text: Typography, spacing, wording, focus, empty states, errors, transitions and micro-interactions form a single experience. No detail compensates on its own for a poor solution, but their accumulation can either reinforce or erode trust.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-07:
    sourceHash: 77fdd4790edf55296f4af2f6cb48556b75b32b7fa9c25f2528c0da24ae0168b0
    state: aprobada
    text: Users do not separate interface, engineering and content. They experience a complete product. One small inconsistency may be tolerable; a hundred inconsistencies turn use into constant friction.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-09:
    sourceHash: 80d30e9a1cf740ddfadd3f611b145d771a47517e9ecbbf4c251f90ecd8afc93a
    state: aprobada
    text: |-
      - Design and verify normal, empty, loading, error, success and recovery states.

      - Keep language, hierarchy and behaviour consistent throughout the flow.

      - Review the product at actual size and with realistic content before approving it.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-11:
    sourceHash: 72e0dd527695b2c8c5a78528b6f972e23155f93663f5cfbda76e4769a4004516
    state: aprobada
    text: |-
      - Do the details reinforce the same logic, or do they contradict expectations?

      - What happens in the less frequent states?

      - Does the product feel deliberately built, or assembled from parts?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-8-12:
    sourceHash: 5f4da174ee4ea0a9a04128d832a65538e5506917ac9d13063ec2c4d4c0b5ea44
    state: aprobada
    text: "**Sign of non-compliance.** A button changes its label between steps, an error appears far from its field, and focus is lost after saving. Each defect is minor; together they break continuity."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p09:
    sourceHash: f0c567a03f20a9eb3453bc8007b36c8404029f97a514cb6a6e5fef4a053e43d0
    state: aprobada
    text: "## PRINCIPLE 9 · `P09`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-02:
    sourceHash: 1d7feadee74c9ed9f0caa95b4d5b06e9007c94df82557fb07e4f27079b8c15ed
    state: aprobada
    text: "### Time and continuity are part of the interface"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-03:
    sourceHash: 18b4d70f6dca56535c460a50e1fd1374e98beabaa49b49b7b20aa6069e69cefd
    state: aprobada
    text: The person experiences the wait before they know anything about our architecture.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-05:
    sourceHash: 7da6e8caf7c4dd422a3820b734e375791f493b99a9ba5df987572e66ce5e4795
    state: aprobada
    text: Latency, availability, synchronisation and preservation of work are properties of the experience. The user does not distinguish between infrastructure and interface when a response is slow, an action is duplicated or progress is lost.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-07:
    sourceHash: 7dada98ca2b48a1a45500f37e280dc55a9d49525928fef840356a801fd83ea20
    state: aprobada
    text: "Slowness changes behaviour: it produces repeated clicks, hesitation, abandonment and errors. Loss of continuity forces people to rebuild context and destroys trust quickly."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-09:
    sourceHash: fac5fc0b3cb87445f6a43c0d1d77658f1630fdc126991d9b4bb2cfaba64c75c3
    state: aprobada
    text: |-
      - Define response budgets for critical interactions.

      - Show honest progress and allow work to continue when an operation may take time.

      - Save work, context and state at a frequency proportionate to the cost of losing them.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-11:
    sourceHash: e52ccb34802fa685d322eaa33eaf5fe779873243f5fa794962ac1548be92ab51
    state: aprobada
    text: |-
      - Does the interface respond immediately even though the underlying process continues?

      - What does the person lose if the connection fails right now?

      - Does the product avoid duplicate actions and ambiguous states?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-9-12:
    sourceHash: ee9ff5001e2e1d6be5d646cc8fa7167811bcb76e596d3270341d7d70b28deafe
    state: aprobada
    text: "**Sign of non-compliance.** A button with no feedback for three seconds invites a second press. The resulting duplication looks like user error, but it originates in the system."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  p10:
    sourceHash: 6ada26f0e7de696ac21f140b4411ef270d3a565c451b56aeb47b29661e439fe5
    state: aprobada
    text: "## PRINCIPLE 10 · `P10`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-02:
    sourceHash: 15246d01395fdb9040ff4ffc9bd96892696bce8ea5ab604dd2c05fb8264b19a6
    state: aprobada
    text: "### The person retains control and ownership"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-03:
    sourceHash: b9572e505ed1b3606800557fbc5ca19137324943dc4123606b5b35a63e1f01ff
    state: aprobada
    text: Helping does not mean deciding for the person or taking over their work.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-04:
    sourceHash: 60a6117a450f0ae64201ccf9f61b9ebeacefb65cc00f1e21cab5b5e0390c010b
    state: aprobada
    text: "#### What it means"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-05:
    sourceHash: f7f9cbb6f1efe00338292681e3f79ef2c2c4fe37165cfa2f8a3b112b0c5db1ff
    state: aprobada
    text: Software can anticipate, recommend and automate. It must do so without hiding decisions, locking information away or preventing alternatives. In systems with AI, control includes understanding what information was used and what action was carried out.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-06:
    sourceHash: 960ee0f1264b957fce29c836b5da2809cd772a47ae1b19f446679f0b5243a0a9
    state: aprobada
    text: "#### Why it matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-07:
    sourceHash: 4dc2876456d8753a0a90b27260b1189128340c47ea03a8d22cb1bb7ca1171668
    state: aprobada
    text: Automation without human agency can accelerate the wrong path. Ownership and portability reduce dependence, strengthen trust and allow people to combine tools according to their needs.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-08:
    sourceHash: e4a3e0cc5b8c9923642b50fb1f1d6a5c2e80a19659b1bcdd79d306548e902e6e
    state: aprobada
    text: "#### Design rules"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-09:
    sourceHash: a3e1c19f780784c2d45c1fd5bdd577516c49538b93aee990f022b6f22cf13d56
    state: aprobada
    text: |-
      - Ask for confirmation in proportion to the impact, not for every gesture nor after an irreversible action.

      - Allow reviewing, editing, exporting and reverting where the domain permits it.

      - Explain the use of data and separate authorisation, recommendation and execution.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-10:
    sourceHash: 9e61f16fa39fd4463add6fb444476b806b2fe65f31bb40542f7453c32a3ba297
    state: aprobada
    text: "#### Decision tests"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-11:
    sourceHash: 02df8f5aeac27a611a5e908492b4bcc2ea2bd988e685b816b8dbfc92a5a24c96
    state: aprobada
    text: |-
      - Can the person reject the proposal without losing their progress?

      - Do they understand what data was used and for what purpose?

      - Can they recover or take their content away in a useful format?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  principio-10-12:
    sourceHash: f1d84896822a2b206cdce9825313b67f19d4e99595faa5d1957bffc1aa526375
    state: aprobada
    text: "**Sign of non-compliance.** An AI that rewrites and publishes without a preview turns assistance into appropriation of the process."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  sh-fund:
    sourceHash: 28dc64c19ec351959bea52b47a71d750b13a1d7801338fe16c674b5e5fcc5f0b
    state: aprobada
    text: "## PRODUCT FOUNDATION AND REFERENCE FORM · `SH-FUND`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-02:
    sourceHash: b7100a84cb226e1f7b6116d5841bd92a4eea2fb8abe4084115b79d918e442a19
    state: aprobada
    text: "### From the product foundation to a verifiable solution"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-03:
    sourceHash: 1f1ce84996b9601d017a598cd44dd2cc79fc89024ef32fa3a5fd281e43ca88a4
    state: aprobada
    text: The product foundation is the authorised content that establishes what must be built, why it must exist, what results it must produce, what conditions it must respect and how compliance can be determined. It is not a new kind of document nor a mandatory template. It may be found in a Job Story, a Jobs to Be Done statement, an epic, a capability, a requirement, a business rule, a journey, an acceptance criterion or a coherent combination of these elements.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-04:
    sourceHash: 50e5a11c166803d56e68b5926e90214d6af0e421910fcb1105f34e38d007b757
    state: aprobada
    text: "#### When the foundation is identifiable"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-05:
    sourceHash: 06871f398db55a7f46dbce3443ecaf9bee13aa0d9f960e36c78c80d4908076e0
    state: aprobada
    text: A product foundation is identifiable when development can establish, without inventing product decisions, the following elements. They may be spread across one or several parts of the definition received, and they need not use these names or this order.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-06:
    sourceHash: dae6347dcd97e3f17f71a69b0db1a1b94a76bdce924fd54a0a04be1719715228
    state: aprobada
    text: |-
      | **Element**              | **Control question**                                       | **Minimum condition**                                        |
      |--------------------------|------------------------------------------------------------|--------------------------------------------------------------|
      | Source and authority     | Where does it come from and who may modify it?             | Traceable origin and recognised authority                    |
      | Reason                   | What situation, need, problem or opportunity does it address? | Justification that is understandable without the solution    |
      | Result                   | What change or progress must it produce?                   | A result recognisable to people or to the product            |
      | Conditions and limits    | What rules, constraints and exclusions must be respected?  | Limits sufficient to prevent silent decisions                |
      | Evidence                 | How will we know it has been met?                          | Criteria, observations or tests proportionate to the risk    |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-07:
    sourceHash: 8e810c1d69150618d75154e4efa918ace04ddbea0a13eff18cca37c6c64565c5
    state: aprobada
    text: The absence of a specific section or field in the PRD is not in itself a defect. The method must understand the structure the product uses. If a definition capable of materially changing the solution is missing, the agent must surface the gap and refer the matter to the corresponding authority; it must not fill it in through a silent inference.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-08:
    sourceHash: a4bbe9c48535bac7e39894360f375fbbe53c6833373ca87f793463181cf68c47
    state: aprobada
    text: "#### Full scope and product authority"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-09:
    sourceHash: 582eb29539eef9434ed38b8b9e02495e6dd1cf2f1d6feb2eeef9c9a702d336f4
    state: aprobada
    text: When an approved product definition contains multiple stories, capabilities, rules or specifications, all of them form part of the scope unless the definition itself or an authorised decision establishes otherwise. The development plan must understand the whole, resolve its relationships and dependencies and ensure its coverage. It may break the work down, order it, group it or run it in parallel; that breakdown does not modify the scope.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-10:
    sourceHash: 3490302753a3ffee83a622a85bcc483ad05c3fbc270373bf8319ab6312e19469
    state: aprobada
    text: The plan organises how the scope is implemented. It does not silently decide which part of the scope deserves to exist.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-11:
    sourceHash: 762e840879ddb06dc81646fdbac333bff87736b2f7f74045d0ca19d3417541a6
    state: aprobada
    text: |-
      - Every omission, modification or deferral must be explicit, traceable and approved by the product authority.

      - If constraints of time, resources or technology prevent covering the scope, the plan must make the incompatibility visible and request a decision.

      - An incremental, phased or release-based strategy may be used where the project adopts one; it is not an obligation of the core.

      - Completeness is determined by reconciling the implementation and the evidence against the complete product definition and its approved exceptions.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-12:
    sourceHash: c2bac53c97da13869667bb5a7be186fc6bac2bc58a38e24dbceff8fcf10be5c4
    state: aprobada
    text: "#### Job Stories as a reference form"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-13:
    sourceHash: 66be5c2c894c7908b947da0131335909e248118f25d99da6b4520069e224a120
    state: aprobada
    text: This manifesto uses Job Stories as a reference form for showing how a product foundation can be carried through to design, implementation and verification. Job Stories make the circumstance, the motivation and the expected outcome explicit, which makes them a particularly useful representation for reasoning about human progress.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-14:
    sourceHash: 1f5338b10b2f25a4c2e7e21448aa07cfa42028fe890d18bdd4328bf22dfb0ea4
    state: aprobada
    text: Their use in the explanations, rules, examples and tests does not require every product definition to be expressed through Job Stories, nor does it authorise automatically transforming a PRD into that structure. Where the definition uses another form, the method must preserve its meaning, its relationships and its authority. A derived Job Story may be proposed as a working view where it adds clarity, but it does not replace the source nor acquire authority by having been generated.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-15:
    sourceHash: c8e6c780f62aea2977b73ad50521fa42db2a02ccab900473180048d448ce6437
    state: aprobada
    text: "#### From Jobs to Be Done to Job Stories"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-16:
    sourceHash: 39fdb10d7f0531b920be96d69f36bb21225442fcbc317845cd4b6fb08b3192b4
    state: aprobada
    text: "Jobs to Be Done and Job Stories serve different functions. Jobs to Be Done maintains the product's direction: the broad progress that leads a person to adopt a solution in their life or work. The Job Story narrows that progress down to a concrete situation that can guide a design decision, an implementation and a test."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-17:
    sourceHash: 40e7db4f113808e7624d1f55e2e6f8f5ed8593d2ed88c33cc104ff03b26acb32
    state: aprobada
    text: When this form is used, each Job Story must retain an explicit relationship to the corresponding higher-level job, purpose or outcome. That relationship prevents an isolated story from losing the product's direction.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-18:
    sourceHash: 8bb295157d42d8e63f097ef6d5e7d09aee62232c312a537f9c04ac2a77ba5e66
    state: aprobada
    text: "#### Relationship between the levels"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-19:
    sourceHash: abbd0b60a00953d5be31a411d9f9ef6915648dd25813f6b854122e71f6d67f22
    state: aprobada
    text: |-
      | **Level**               | **Defines**                                                                          | **Avoids**                                                |
      |-------------------------|--------------------------------------------------------------------------------------|-----------------------------------------------------------|
      | Jobs to Be Done         | The broad progress the person is seeking to achieve                                   | Organising the product around features                    |
      | Job Story               | The circumstance, motivation and outcome that trigger a concrete need                 | Designing from generic roles or literal requests          |
      | Product response        | The system behaviour chosen to address the story                                      | Confusing the problem with the first solution imagined    |
      | Acceptance evidence     | The observation that demonstrates progress in that circumstance                       | Accepting a delivery because it works technically         |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-20:
    sourceHash: b69d58a05cbd1a6cbb8c0401e1b0fdb82d0300148e2c5e1bb87564bc6461916e
    state: aprobada
    text: "#### Canonical form of a Job Story"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-21:
    sourceHash: 967178a07d1c0e94aaa181c16efc19614d3de46e2cbc0f04669550164aff2642
    state: aprobada
    text: When an observable circumstance occurs, I need to make progress without prescribing the solution, so that I can reach a recognisable outcome.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-22:
    sourceHash: 2685adfa446a5edbaaec3c06924ad5c4da64dd349ac0d032a3d7f503427b7800
    state: aprobada
    text: "**When.** Describes the fact, change or tension that triggers the need. It must be observable or recognisable without depending on a fictional persona."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-23:
    sourceHash: 79d2e702e9d92923fd1ea97a07190a434b2bc5e6a3b55a947d94df21b8871011
    state: aprobada
    text: "**I need.** Expresses the motivation, understanding or decision required. It does not name a screen, a button, an agent or a feature."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-24:
    sourceHash: a875e497f923bfa362ac3354473a0d91c605ac1984b74490c012951b17c5c661
    state: aprobada
    text: "**So that I can.** Defines the improved situation the person is seeking to reach, and which will later have to be verified."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-25:
    sourceHash: 1f5cf2cf0eaeb16a7f1ea59684253eec168a9e957180694008dc51055a0fc51d
    state: aprobada
    text: "#### Minimum evidence accompanying the story"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-26:
    sourceHash: 3e8bd582630f368a1bdc600388558dd2dab581f7469247f242be319885a8fe3e
    state: aprobada
    text: The sentence guides the conversation, but it does not replace research. A story ready to guide development must record only the evidence needed to support its decisions.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-27:
    sourceHash: 4633734dfe1ced95bcfe54c42370a4b397d4b481ee35deea60038c9b91a98a3e
    state: aprobada
    text: |-
      | **Element**            | **Question**                                                    | **Minimum content**                                          |
      |------------------------|-----------------------------------------------------------------|--------------------------------------------------------------|
      | Current behaviour      | What does the person do today?                                   | Observed steps, workaround or abandonment                    |
      | Obstacle or anxiety    | What holds progress back or makes it risky?                      | Relevant doubt, cost, fear, effort or dependence             |
      | Causal evidence        | What supports the link between circumstance and motivation?      | Observation, interview, usage data or a declared assumption  |
      | Evidence of success    | What would demonstrate that progress occurred?                   | Observable behaviour or outcome within the circumstance      |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-28:
    sourceHash: 3aa854ab26bacc761a9e97ba2b125d1825672ef4b281c870e2de559aba80202f
    state: aprobada
    text: "#### When role still matters"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-29:
    sourceHash: 3029109989091ed6db868915c6c56a3a0aa1dea7d7caa0e4444e2e9635309e64
    state: aprobada
    text: Job Stories avoid using role as an automatic explanation. They do not eliminate real differences between people. Role, experience, age, permissions or a physical constraint must be incorporated when they causally change the circumstance, the risk or the valid solution. If they do not change the decision, they must not govern the story.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-30:
    sourceHash: 0d0721ddc628a94b5f24eadc57b4ca739df59a622f08dec3e5c20bbb924589b7
    state: aprobada
    text: "#### Quality tests before designing"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-31:
    sourceHash: 36a28f3244b75e8722364116bd6c17102056bedc48a92c16bd8a572425d485c1
    state: aprobada
    text: |-
      - The circumstance describes a concrete trigger and not a category of user.

      - The motivation expresses progress or understanding and not a requested feature.

      - The outcome can be recognised without confusing it with completing the product's flow.

      - The story is backed by evidence, or it clearly identifies the outstanding assumption.

      - The formulation allows several responses to be compared, including the option of not building.

      - The scope is sufficient to change a decision, but does not attempt to contain the user's entire work.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-32:
    sourceHash: 4bcb54afaf0c880a1da84626eed84e955aa4345d043a589814acb97ffc746702
    state: aprobada
    text: "#### Chain of traceability"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-33:
    sourceHash: 73ed0ba5b70049eafa7be622a02dc8683cb0d4ebf41a33867122572da1c8909a
    state: aprobada
    text: "Development must be traversable in both directions: from each implemented decision back to the product foundation that justifies it, and from the complete product definition forward to the evidence that demonstrates its coverage. Where the foundation is expressed through Job Stories, traceability must preserve the circumstance, the motivation and the outcome of each applicable story."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  fundamento-de-producto-y-forma-de-referencia-34:
    sourceHash: 176891ffa1eaae59a0f6f0c223b53f4ef2aaf70bc26f5b170b9211faba7eb9d6
    state: aprobada
    text: |-
      | **Origin**                 | **Decision**                                                                        | **Verification**                                                           |
      |----------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------|
      | Product definition         | What must be built and under what conditions                                         | Every mandatory element has coverage or an approved exception              |
      | Jobs to Be Done            | What general progress deserves attention where this form applies                     | The outcome remains relevant to the person                                 |
      | Job Story                  | What concrete circumstance must be addressed where the source uses this form         | The story is validated and does not prescribe an unauthorised solution     |
      | Design and implementation  | What behaviour responds to the foundation                                            | Every element has a traceable reason                                       |
      | Acceptance                 | What evidence authorises declaring the development complete                          | Results, rules and criteria are met under the defined conditions           |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-01:
    sourceHash: 6ec494189300971192b2c0d36750706a8adc8f5217c441ad3f8ed8c3c1d57180
    state: aprobada
    text: "## DOCTRINE FOR DEVELOPMENT WITH AI"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-02:
    sourceHash: 3fe47f4dc19057e2f303e9771bd0d7590358c0b6216666f7236a0a63bc1d0eee
    state: aprobada
    text: "### When building costs less, the decision matters more"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-03:
    sourceHash: 5aef2c6b0f98b4eeda8fb34018d151ffcc56822ae6fea61bbddd260d2a30a690
    state: aprobada
    text: Coding agents reduce the cost of turning instructions into software. That advantage shifts the bottleneck. The problem is no longer only whether a capability can be built, but whether it deserves to exist, whether it solves the right problem and whether it preserves the user's understanding.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-04:
    sourceHash: 051b2e7cacbfc6d1782dd56799007a9bc87266bbbf198150ad13378a300e902e
    state: aprobada
    text: AI must absorb complexity, not produce it.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-05:
    sourceHash: 849d990414ea076bba7f0390e97d4b948afe1666a74da24382e793fb94cdd0a1
    state: aprobada
    text: An agent can implement a weak specification at great speed, reproduce conventional patterns that do not fit the context and add plausible options that nobody asked for. This is why AI-assisted development needs an explicit layer of intent, limits and verification.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-06:
    sourceHash: 45f85b0e1fa5bdc616d88610a051938dd0b4e807eba15d360cbc2cbceef3d83b
    state: aprobada
    text: "#### Six directives for teams and agents"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-07:
    sourceHash: 58955d53a04d2b2d3ff2bec23c4d279f6b3f834aafc7e9d348b887e3dfa9cc4b
    state: aprobada
    text: |-
      | **Directive**                                         | **Requirement**                                                                                                                                                                                              | **Limit**                                                                                                  |
      |-------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|
      | `D01` Foundation before implementation                | Understand the product definition, its authority, its scope and the evidence behind it before proposing components or code. Where Job Stories exist, preserve their circumstance, motivation and outcome.        | Do not start building if a material ambiguity may alter the solution, the scope or a rule.                  |
      | `D02` Sufficient specification before generation      | Define states, decisions, constraints and acceptance criteria at the level the risk requires.                                                                                                                    | Do not turn a vague prompt into an extensive implementation and then use the code to discover the problem.  |
      | `D03` Deliberate simplicity                           | Prefer the solution that demands fewer concepts, decisions and memory from the user where both achieve the same result.                                                                                          | Less code is not the measure; less unnecessary burden is.                                                   |
      | `D04` Determinism where it matters                    | Implement critical rules, permissions, calculations, states and validations as verifiable logic.                                                                                                                 | Do not delegate certainty, compliance or security to a model's variable behaviour.                          |
      | `D05` Verification before acceptance                  | Evaluate the flow, the edge states, accessibility, performance and the real outcome.                                                                                                                             | Generated code and passing unit tests do not amount to a finished product.                                  |
      | `D06` AI subordinate to the user                      | Use AI to propose, explain and execute within clear limits, keeping review and reversibility proportionate to the impact.                                                                                        | The fluency of a response never substitutes for evidence or authorisation.                                  |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-08:
    sourceHash: e25d483f0644c0d76b67852aea2b4cbbf398d17677dd37bcd6f61cbe260eb01d
    state: aprobada
    text: "#### The second governing question"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-09:
    sourceHash: 734d21d7bafa562e60fbf164aafcb78a10629581a0d65b1da83da0ce5b9c28f5
    state: aprobada
    text: Now that we can build almost anything more easily, what deserves to be built and what should we deliberately leave out?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-10:
    sourceHash: 03a45914ba87b1ea1c8212cd20e11a2455baea0c52e9e1e288eeabd9673ab342
    state: aprobada
    text: This question introduces an obligation that could previously remain hidden by technical cost. It must be raised during the product definition and when evaluating alternatives, not used during implementation to unilaterally trim an approved scope. Every capability must justify its existence against a simpler alternative, including the alternative of not building it; once authorised, any exclusion requires a traceable product decision.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-11:
    sourceHash: b36ca7adbc0b4fae7784a15b59d1a0e7bb9afa440dce25d6b2c3d9dd8791b831
    state: aprobada
    text: "#### Determinism and generation"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-12:
    sourceHash: 9baf0423aa636a626e68fe0c484c77b002a84c6ca725cc01931a474dea2108c0
    state: aprobada
    text: The choice is not between a deterministic product and a product with AI. A dependable system combines both according to the nature of each decision.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  doctrina-para-desarrollo-con-ia-13:
    sourceHash: e25ff7b936ddb193a34af12928e42d357daaf99600d33fe5df11f675ed2ab803
    state: aprobada
    text: |-
      | **Type of behaviour**                                                  | **Preferred treatment**                        | **Examples**                                                  |
      |------------------------------------------------------------------------|------------------------------------------------|---------------------------------------------------------------|
      | Must always produce the same result under the same conditions          | Deterministic rule and automated test          | Permissions, prices, limits, calculations, state transitions  |
      | Can yield several useful answers and requires interpretation           | AI with context, limits and evaluation         | Explaining, summarising, proposing alternatives, classifying text |
      | May affect money, reputation, security or rights                       | AI proposes; a rule or a person authorises     | Publishing, purchasing, deleting, sending, changing access    |
      | Uncertainty is part of the output                                      | AI declares assumptions and confidence level   | Recommendations, estimates, incomplete information            |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-01:
    sourceHash: 9cc6718b376174b98c04dabb04b4faa7f08edfd2f3954ec9fa398d127946c091
    state: aprobada
    text: "## WORKFLOW"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-02:
    sourceHash: 6d626dfdd0f89b9643b2c9cc5963178cf9b5b3ca7ec644068aa634cd4a860082
    state: aprobada
    text: "### From purpose to a verifiable solution"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-03:
    sourceHash: eaacb80789271e6e69fc3bd0d48c80fbc0fa76095ffec0099d47b7e4e8b0ea5c
    state: aprobada
    text: The flow prevents code generation from becoming the first act of design. It does not seek to create a documentation-heavy phase or to impose a structure on the PRD. It aims to understand the foundation received, produce the clarity needed to plan and maintain coverage through to acceptance.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-04:
    sourceHash: 8600ba0c5ec71fb3dfa8d21ff5e373d283d3a2e2e3a71186afc403f04a289f5f
    state: aprobada
    text: |-
      | **Step** | **Decision**                       | **Work**                                                                                                     | **Minimum evidence**                                                              |
      |----------|------------------------------------|--------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
      | `F01`    | Understand the foundation          | Recognise the sources, the authority, the scope, the structure used and the expected results.                  | A faithful map of the product definition, without reformulating it for technical convenience. |
      | `F02`    | Establish coverage                 | Inventory the applicable stories, capabilities, rules, states, journeys, criteria and relationships.           | Complete coverage, with gaps or contradictions made visible.                      |
      | `F03`    | Plan the implementation            | Resolve dependencies, blockers, order, parallelism, integration and testing without modifying the scope.       | A coherent plan that accounts for the whole approved definition.                  |
      | `F04`    | Make progress concrete             | Use the existing Job Stories, or formulate a derived view where it adds clarity and is identified as such.     | Circumstances, motivations and outcomes preserved where applicable.               |
      | `F05`    | Establish the experience contract  | Describe what the person must understand, decide and feel at the critical moments.                             | Main route, states and interaction promise.                                       |
      | `F06`    | Model rules and risks              | Separate deterministic logic, generative behaviour, permissions and irreversible actions.                      | A map of decisions and limits.                                                    |
      | `F07`    | Explore and prototype              | Compare alternatives and test understanding, hierarchy and recovery before optimising code.                    | The reason for the chosen alternative and evidence from the journey.              |
      | `F08`    | Build, integrate and verify        | Implement the plan, maintain traceability and reconcile results against the full scope.                        | Code, tests and evidence of coverage; outstanding items and exceptions made explicit. |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-05:
    sourceHash: b4450ce74b89e5be7528134017cadaed64814b5d3a5d5faec3104516c36e10e8
    state: aprobada
    text: "#### Artefacts matched to context"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-06:
    sourceHash: 80a83c92ab23750cf86c22eb01fd13dc6b807bcf5f96393683d7d0ddbd4f25b4
    state: aprobada
    text: Each artefact exists to answer a question, not to satisfy a template. It may be a section of the PRD, a derived view, a table, a test or a separate document. If the information already exists, it must be referenced and not duplicated. Depth depends on length, complexity, uncertainty and risk; if an artefact neither changes a decision nor helps verify one, it must be simplified or removed.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-07:
    sourceHash: 2bac946570a18170e8f22285fa9c07bb71d66316a13c417a4bc20f242f848510
    state: aprobada
    text: |-
      | **Artefact**                        | **Question**                                                | **Minimum content**                                                                                      |
      |-------------------------------------|-------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
      | `A01` Map of the foundation         | What must be built, why and with what authority?            | Sources; scope; results; rules; limits; evidence; non-goals                                               |
      | `A02` Coverage map                  | How will the full scope be accounted for?                   | Mandatory elements; relationships; dependencies; implementation; tests; status; exceptions                |
      | `A03` Job Story sheet where applicable | When does the need arise and what change is the person after? | Circumstance; motivation; outcome; current behaviour; anxiety; evidence; assumptions                   |
      | `A04` Experience contract           | What must the person understand and be able to do?          | Main route; language; decisions; feedback; control; recovery                                              |
      | `A05` State model                   | What can happen and which transitions are valid?            | States; events; rules; errors; permissions; persistence                                                   |
      | `A06` Complexity budget             | What burden are we adding?                                  | New concepts; decisions; steps; exceptions; visible options                                               |
      | `A07` Acceptance plan               | What evidence authorises declaring the development complete? | Results; rules; Job Stories where they apply; accessibility; performance; edge states; metrics           |
      | `A08` Decision record               | Why did we choose this alternative?                         | Alternatives; trade-offs; assumptions; decision; date; outstanding evidence                               |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  sh-stop:
    sourceHash: c7dc7b1e7898b9ae55375cdb9529736dde237c5a4cde0c8dcce68bb8bef8550a
    state: aprobada
    text: "#### Stopping rule before generating · `SH-STOP`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-09:
    sourceHash: 01b6078a8d42bfb7099c33675029b7df5165f32d9d0a86e38e07575589d6aaa7
    state: aprobada
    text: "The agent should not begin an implementation if it cannot answer the following questions precisely, at the level required by the risk and the complexity:"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-10:
    sourceHash: de2c829d115613eecff7737e175cfe500e1cdcf1d8e4eb47dc1fa2fd9c46612b
    state: aprobada
    text: |-
      - What is the authorised product definition and what scope does it establish?

      - Which elements of the foundation justify the development and what evidence supports them?

      - Does the plan account for all mandatory stories, capabilities, rules, states and criteria?

      - Where Job Stories exist, are the circumstance, the motivation and the outcome separated from the solution?

      - What is the main route and which alternative states matter?

      - Which decisions must the user make and which can the system resolve?

      - Which behaviour requires deterministic certainty?

      - What falls outside the scope and who established that exclusion?

      - What evidence will demonstrate that the development is complete?
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  flujo-de-trabajo-11:
    sourceHash: f99a7c7fa15cf988ed2d14bdf68e321d9777f4a5d13c5f5a8b97ba03bbdb0fe7
    state: aprobada
    text: If an answer is missing that could materially change the solution, the scope, a rule or a right, the agent must stop and ask for it. If the uncertainty is minor, reversible and within its authority, it may declare an assumption and proceed without silently reducing the coverage it has committed to.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  contrato-reutilizable-01:
    sourceHash: ba40132368df764cccb66afba32a5303c9633477c97b057132a34b4b55104387
    state: aprobada
    text: "## REUSABLE CONTRACT"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  contrato-reutilizable-02:
    sourceHash: 867d80d56adcf484b852731eace1af0a2e7ada4951bfc0bb9a01145221467959
    state: aprobada
    text: "### Instructions for a development agent"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  contrato-reutilizable-03:
    sourceHash: 796823b9f0b12e6893094c2571ac76b30a18dcf8e30b463ff563cc0ecb84256f
    state: aprobada
    text: The following contract can be incorporated into a repository's instructions, into a PRD or into a coding agent's prompt. It must be accompanied by the product's specific context and does not replace the definition of the problem.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr01:
    sourceHash: 9279043c64d698224b8bdcac316a3961dbe0415ac67a2fa7259e81ea0f621fb4
    state: aprobada
    text: "**`CR01` Purpose.** Build the simplest solution that lets the user achieve the defined outcome, preserving clarity, control and the ability to recover."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr02:
    sourceHash: 82680a309c435d1c8fa26ac51cdd2bbdf49431464bb338eaa1c65432d0b60992
    state: aprobada
    text: "**`CR02` Before programming.** Identify the authorised sources, explain the product foundation and confirm the full scope. Recognise the structure the definition uses; where it contains Job Stories, preserve their circumstance, motivation and outcome. Separate evidence from assumptions and identify any ambiguity that could materially change the solution."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr03:
    sourceHash: 7e3ead93f9ea8176fa06c81ad236e3a56806259a2eb0a5474250f2a8eb1cdeb8
    state: aprobada
    text: "**`CR03` When planning.** Account for every mandatory element and establish their dependencies, blockers, order, integration and tests. Do not select, omit or defer parts of the scope on your own initiative. If constraints prevent covering it, request a decision from the product authority."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr04:
    sourceHash: a7b0b09a1e72ba4b0ed08a4254c6b13ab7739ad7f30074236608a659e80a0736
    state: aprobada
    text: "**`CR04` When proposing.** Present the recommended alternative, a simpler alternative and the option of not building, where the decision still belongs to product. Explain how each one responds to the foundation, what burden it introduces and what trade-offs it demands."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr05:
    sourceHash: e97b99643eec69194f47c25ecc10fc6a3186d1b4d017117376363308ac0ac7c6
    state: aprobada
    text: "**`CR05` When designing.** Do not expose internal structures. Use the user's language, known conventions, a clear hierarchy, progressive depth, editable defaults and immediate feedback."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr06:
    sourceHash: 82ee6e62250a52ec1526b88fc26ba6738c541228d5d7c996153493d9270b116c
    state: aprobada
    text: "**`CR06` When using AI.** Reserve critical rules for verifiable logic. Declare uncertainty. Do not carry out high-impact actions without proportionate authorisation. Maintain traceability, review and reversibility."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr07:
    sourceHash: 36e9974b51e5c844f7f5ecc898f07a3caa1b046b7bdfe2282e290fa24a245518
    state: aprobada
    text: "**`CR07` When implementing.** Respect the agreed scope and preserve traceability to its foundation. Do not add features, modes, configurations or abstractions that were not requested. Cover empty, loading, error, success and recovery states, and integrate the related parts."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  cr08:
    sourceHash: 83f7caeea75ddb6534fd3c4e0d57c5e539a24a13b05cd1a9fe29b8bd592c9c62
    state: aprobada
    text: "**`CR08` Before declaring the work complete.** Reconcile the implementation against the complete product definition. Verify results, rules, criteria and, where they apply, the Job Stories in their circumstances. Also check accessibility, perceived performance, errors, persistence of work and user control. Deliver evidence, outstanding items and approved exceptions."
