  antipatrones-02:
    sourceHash: 0f197db02f90d1b1b205cfa5885a4bbdf7a3c9d139c632ab006b8b33e52d291a
    state: aprobada
    text: "### Signs that the product is drifting away from the manifesto"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  antipatrones-03:
    sourceHash: bf1d3ccdb739835589dfc14bc8e09b82cd5d5d7f85f02435498cd7df524ece4f
    state: aprobada
    text: |-
      | **Anti-pattern**                              | **How it shows up**                                                                                      | **Response**                                                                             |
      |-----------------------------------------------|----------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|
      | The Job Story is a feature in disguise        | The motivation says to use a dashboard, receive alerts or press a button.                                  | Reformulate the progress the person needs without anticipating the answer.                |
      | The circumstance was invented                 | The team writes a plausible story without observing behaviour, tension or real context.                    | Mark it as a hypothesis and obtain evidence before extending the implementation.          |
      | The interface mirrors the database            | The user has to choose internal types, states or relationships.                                            | Translate the structure into human goals and decisions.                                   |
      | More options are mistaken for more value      | Every exception turns into a visible control.                                                              | Resolve by context and reveal exceptions when they arise.                                 |
      | AI fills conceptual gaps                      | An ambiguous prompt produces a large implementation.                                                       | Stop, clarify the material assumptions and preserve the authorised scope.                 |
      | The plan selects scope                        | Some stories or rules are implemented and the rest deferred without a product decision.                    | Restore full coverage, or record an explicit and approved modification.                   |
      | Decomposition is mistaken for exclusion       | A technical phase is presented as though it redefined what the PRD requires.                               | Separate execution order, progress status and committed scope.                            |
      | The tutorial compensates for an opaque interface | The basic task requires prior explanation.                                                              | Review language, hierarchy, conventions and feedback.                                     |
      | Confirmation substitutes for reversibility    | The system asks several times, but there is no undo.                                                       | Design recovery and use confirmations only according to risk.                             |
      | The happy path defines the product            | Errors, empty states and interruptions are left for later.                                                 | Model states before implementing and accept them explicitly.                              |
      | A fluent answer looks true                    | The user does not distinguish fact, inference and proposal.                                                  | Show source, uncertainty, limits and a route to verification.                             |
      | Technical speed hides the wait                | The operation takes time with no feedback, or blocks the whole flow.                                       | Respond immediately, show progress and preserve continuity.                               |
      | Aesthetics paper over friction                | The screen looks good, but demands unnecessary decisions.                                                  | Evaluate the complete journey and the real effort.                                        |
      | The agent adds things just in case            | Modes, preferences and abstractions appear that nobody asked for.                                          | Define exclusions and require justification per capability.                               |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  antipatrones-04:
    sourceHash: 42dd2cfcf7bcb086bbf3e38e870b44fa203c7de3cc3dd70ce3d19b1ed7cf96bc
    state: aprobada
    text: "#### A warning about simplicity"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  antipatrones-05:
    sourceHash: 2064e8a1ae3e809d377548116e1d709d83b50e8c119db7ff6165a333a3966ba1
    state: aprobada
    text: Simplicity can become an excuse for hiding information, denying legitimate cases or limiting the expert user. The framework does not reward empty interfaces. It rewards the right relationship between capability, moment and context.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  antipatrones-06:
    sourceHash: 57c9d01614969091544eb774af98b5a1ca52ea71b58f8c22c3a8228cb635116b
    state: aprobada
    text: Valuable simplicity does not remove what is necessary. It avoids demanding it before its time.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-01:
    sourceHash: 7bc057be2146d1e5bc0ea4e689a6ba8057bd1b63b45dc2b80cbebdf0ccaad639
    state: aprobada
    text: "## WORKED EXAMPLE"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-02:
    sourceHash: 8ca2c7b9c2be2d7ab767b5196eb47546d880cbdcdc45749848e3bbce650bda28
    state: aprobada
    text: "### A calculus tutor for someone who does not yet understand"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-03:
    sourceHash: 7e6f679d87faf72d6f38e2e7e01b81f7ce76ca37067728137259ba54f6f85e83
    state: aprobada
    text: Consider an application that explains derivatives, proposes an exercise, offers a hint and finally shows the solution. The flow looks complete. However, if the person gets the exercise wrong after reading the explanation and still does not understand the solution, they reach a dead end. The application delivered content, but it did not produce progress.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-04:
    sourceHash: 429248f0e5c8ac9f4386d829db1133e1187061e08d6096d5ad46bf02de716f73
    state: aprobada
    text: "#### From a feature request to the circumstance"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-05:
    sourceHash: 8cbf02893064e0e8c4ee6540cab3547aea32c66d495d77d992dd842f2d79220f
    state: aprobada
    text: "**Weak formulation.** As a student I want to receive hints so that I can solve derivatives. The role is generic, the hint already prescribes the answer, and the outcome does not distinguish understanding from mechanical progress."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-06:
    sourceHash: 9e2b8bf57c843027d9c87bcc27649a8f668295e4cee1d329bc9d8c9c06c2867c
    state: aprobada
    text: "**Main Job Story.** *When I have read an explanation and I still do not know which rule to apply, I need to identify the prior concept I do not understand, so that I can resume the exercise without depending on being shown the solution.*"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-07:
    sourceHash: 04739109376c8b63b690217eb21547dfedfe46c4a7deba875e6e8e6b00b640d9
    state: aprobada
    text: "**Recovery Job Story.** *When I see the solution and I still do not understand why the next step was chosen, I need to reconstruct a single decision using a different representation, so that I can explain the rule in my own words.*"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-08:
    sourceHash: ba8da8980a239f551e975c201c112bfbaf545fd7d1332cf8024c50d2208abc1d
    state: aprobada
    text: "Both stories belong to the same higher-level Jobs to Be Done: developing enough understanding to solve an equivalent exercise with growing autonomy. They describe different blockages, however, and may call for different responses."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-09:
    sourceHash: 6f2171367bbb93cda1efb0359c2d1b1cf181f5a0509353275769bc02fcc9e232
    state: aprobada
    text: "#### Diagnosis from the manifesto"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-10:
    sourceHash: 1dea637d2f5937af96c2b4806082fb4a00db29ca491c2eeb2f879651f331c03c
    state: aprobada
    text: |-
      | **Principle** | **Problem observed**                                                                    |
      |---------------|-----------------------------------------------------------------------------------------|
      | Progress      | The system measures steps consumed, not understanding achieved.                         |
      | Experience    | The person ends up frustrated and with no route to recovery.                             |
      | Complexity    | The explanation preserves the expert's model instead of rebuilding the concept.          |
      | Interface     | Numbers or stages without meaning add incidental learning.                               |
      | Trust         | The final solution is presented as closure, even though understanding is still absent.   |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-11:
    sourceHash: 743220456f41cf9192dad765c5c753a832c9b7e252d0c6d30a79838cd1b8df47
    state: aprobada
    text: "#### Evidence that completes the Job Story"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-12:
    sourceHash: 18248aaccc3245858104aaa482c51d2a95d050d9e8bb368435d89b076ec5b26d
    state: aprobada
    text: |-
      | **Element**            | **Observation**                                                                                       |
      |------------------------|-------------------------------------------------------------------------------------------------------|
      | Current behaviour      | The person asks for a hint, then the solution, and still cannot decide which rule to apply.            |
      | Obstacle and anxiety   | They do not identify the missing prerequisite and are afraid to move on without understanding.         |
      | Evidence of success    | They can choose and explain the rule in an equivalent exercise with less help.                         |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-13:
    sourceHash: a64a984f0420c242fcc7b3895eff9eb9d536b7501f5aae7afaa82167d2974e53
    state: aprobada
    text: "#### Redesign of the journey"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-14:
    sourceHash: 9b1133b85d9aeab0809e0503be5764857c260ad54c3c174f0c4c6da246b3ea1e
    state: aprobada
    text: "1\\. Detect the type of blockage: concept, notation, prior operation or interpretation of the problem statement."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-15:
    sourceHash: 76acda4a8f4e7899e15fcdac9005d39c6c5eff1819cba1984295d51994dbcc30
    state: aprobada
    text: 2\. Reformulate using a different representation, rather than repeating the same explanation with more words.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-16:
    sourceHash: 8ceedd90db1a9e6df1e0fb3af5c5bcc51f93e9c6fcb9b0eedb3c6ed0ac8e64c5
    state: aprobada
    text: 3\. Check an earlier micro-skill through a brief, diagnostic question.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-17:
    sourceHash: 408fd58a3a717f3ff1b0ed44bccad70445638320c102b7736870ba88b3fcdcab
    state: aprobada
    text: 4\. Offer a worked example step by step, with one decision at a time and in the student's language.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-18:
    sourceHash: 64414523bc003cb7b6140f2eb237b907e931b93213c85cd74107992daf4fe0bd
    state: aprobada
    text: 5\. Ask them to explain the reasoning or complete an equivalent step before moving on.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-19:
    sourceHash: b14a00e1f94a074adbb4ee5f67f93567b672759ed6a72de7e84f692bee227853
    state: aprobada
    text: 6\. Always keep a route to go back, switch explanation or ask for human help.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-20:
    sourceHash: 37a9f3515ee6c17e9f76b0029b44018ac8a2549b853680d1db6a7171e426ff3b
    state: aprobada
    text: "#### What stays deterministic and what may use AI"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-21:
    sourceHash: 2c6df24fb64b52527f6aa550ab0888bbbffbbbebe7203ca4ddb2e4b173421f56
    state: aprobada
    text: |-
      | **Layer**        | **Responsibility**                                                                                                                                          |
      |------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------|
      | Deterministic    | Sequence of states; mathematical validation; mastery of prerequisites; record of attempts; progression rules; prevention of dead ends.                       |
      | AI-assisted      | Reformulating an explanation; generating an analogy; classifying the blockage; adapting the tone; proposing an equivalent exercise within validated limits.   |
      | Human control    | Letting the student or tutor choose another route, review the history and correct a mistaken inference by the system.                                        |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-22:
    sourceHash: 4853c20b9863aee97ea50fda01176e424ebbbc62410b88777779b46b83210410
    state: aprobada
    text: "#### Success criterion"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  ejemplo-aplicado-23:
    sourceHash: d33c3518b4dd1f251ee83d5ff01b1327467ed885fd8888dfae1d3ab799a1a907
    state: aprobada
    text: The goal is not for the student to reach the end of the sequence. It is for them to be able to solve or explain an equivalent exercise with less help. That difference changes the interface, the logic, the measurement and the use of AI.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
