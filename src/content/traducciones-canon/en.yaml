  influencias-y-notas-02:
    sourceHash: fd259e3266f52de59fd136810fdf5faae99680bf291dbc568fb4d0f6bbd4b07b
    state: aprobada
    text: "### Origin of this perspective"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  influencias-y-notas-03:
    sourceHash: 96763d193d39fa45b7fb1c43b452125542340057d6b7b0528ccd25cd94ef817c
    state: aprobada
    text: This framework is an independent elaboration inspired by public ideas from Craft and by the conversations that gave rise to this document. It is not an official Craft manifesto, and it does not attribute the operational rules proposed here to Craft's founder.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  influencias-y-notas-04:
    sourceHash: df196e9970e3bbc62375f4461bfcbb56b17ae6d7c12cb64e8e4944517a7635b5
    state: aprobada
    text: "Four influences are taken from Craft: the union of form and function; the effect a tool has on the energy and capability of whoever uses it; adaptable complexity that appears when it is needed; and the human-first approach, as against systems that force people to accommodate themselves to their structure."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  influencias-y-notas-05:
    sourceHash: 3022784d1acb67d9ae809c1c772feaabd522158283c452e6314d913599982ef3
    state: aprobada
    text: From Jobs to Be Done, progress is retained as the higher-level reference. From Job Stories, a concrete way of carrying that progress into design is adopted, through circumstances, motivations, outcomes, current behaviour, anxieties and causal evidence.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  influencias-y-notas-06:
    sourceHash: 619e485337589c33982f4bc03e55e2c86789f4c0330d53c4dd0554efbc726a6f
    state: aprobada
    text: Version 2.1 integrates these influences within a core capable of respecting heterogeneous product definitions. Job Stories remain a reference form and a worked example; they do not replace other authorised structures, nor do they allow their scope to be trimmed.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
