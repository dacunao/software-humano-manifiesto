    approvedAt: 2026-09-28
  gobernanza-04:
    sourceHash: 32a94e0b8d27bca7cb221f7c43540348c6f886626df2f82c617201fe0d10aeda
    state: aprobada
    text: "#### Responsibilities"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-05:
    sourceHash: 49cdfd6eed2d59b98c79a9c5c0a4738aa18842d8e068fa805603f0069edd6b5d
    state: aprobada
    text: |-
      | **Responsible**  | **Main obligation**                                                                                                                                                              |
      |------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
      | Product          | Establishes the authorised definition, the scope, the results, the rules, the non-goals and the evidence of success; validates Jobs to Be Done and Job Stories where they are used. |
      | Design           | Translates the product foundation into journeys coherent with the person's mental model and protects their attention; uses Job Stories where they help make the situation concrete. |
      | Engineering      | Absorbs complexity and guarantees states, performance, accessibility and recovery.                                                                                                |
      | AI agent         | Plans and implements within the foundation and the contract; declares assumptions, maintains coverage and neither reduces nor extends scope on its own initiative.                 |
      | Human review     | Evaluates causality, meaning, risk, the complete experience and the evidence; it is not limited to reviewing code.                                                                |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-06:
    sourceHash: a0bbc460fc8ca6287203ed247c57df87312e6c808abeeab762fc8f71ee2db60b
    state: aprobada
    text: "#### Control points"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-07:
    sourceHash: f9c9fb8519965da72232ad76dfd2151c95af5837e0e45ae70bf1dbdd2473c295
    state: aprobada
    text: |-
      | **Moment**                  | **Decision required**                                                                                                                              |
      |-----------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|
      | Before designing            | Sources, authority, scope, results, evidence, assumptions and non-goals are clear; the Job Stories are understood where they exist.                 |
      | Before generating code      | The plan covers the complete definition and establishes dependencies, chosen response, routes, states, critical rules, risks and acceptance.        |
      | During construction         | The breakdown organises the work without altering the scope; blockers, outstanding items and exceptions remain visible.                             |
      | Before integrating          | Every change preserves traceability to its foundation, respects scope, covers states and passes technical tests.                                    |
      | Before release              | The complete implementation demonstrates results, coverage, understanding, control and quality of experience.                                       |
      | After release               | Outcome, friction, abandonment and errors are observed; the foundation, the stories and their assumptions are revisited where appropriate.          |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-08:
    sourceHash: 478ce516c69a14fe61c0b1a15c8d7b9172b8996f72ad7f481bc1371b04e4637a
    state: aprobada
    text: "#### Evolution of the manifesto"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-09:
    sourceHash: e4c0525d1a4d9f65cfe17088f6887078d0e42ca32a11d3a67f70d8602be24653
    state: aprobada
    text: "The principles must be stable; the rules and tests may evolve with new evidence. Every change should record the problem observed, the decision modified and the reason. The framework must not grow by accumulation: a new rule is only incorporated if it resolves a gap the existing ones do not cover."
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-10:
    sourceHash: 351cdb95d6e4bc395fe9296b0f47a408ce8917e4cec0661e8422fe36fc3a4e68
    state: aprobada
    text: "#### Change control for versions 2.0 and 2.1"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-11:
    sourceHash: 9900aea4b55dee0e957a014904822163d8360c0637c45d84ea1425e29598cb6e
    state: aprobada
    text: Version 1.0 remains as the founding formulation. Version 2.0 preserves its thesis and its ten principles, but replaces generic operational references to Jobs to Be Done with a more concrete and verifiable chain.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-12:
    sourceHash: c4fa37b2b58856cc01f4a39b7e1644bdc83cf53eee3d8ab70fdb769a176c0ffc
    state: aprobada
    text: |-
      | **Area**                | **Adjustment in version 2.0**                                                       | **Content that remains**                                                  |
      |-------------------------|--------------------------------------------------------------------------------------|---------------------------------------------------------------------------|
      | Unit of design          | The Job Story makes progress concrete within a job defined through Jobs to Be Done.            | The user's progress remains the principal measure.                        |
      | Architecture            | A level is added between principle and rule.                                          | Principles, rules and tests keep their function.                          |
      | Flow and artefacts      | Circumstance, motivation, outcome and evidence are required before designing.         | The minimum documentation that changes decisions is retained.             |
      | Development with AI     | The agent must reformulate and respect the Job Story.                                 | Limits, determinism and human review continue.                            |
      | Acceptance              | The outcome is tested under the circumstance described.                               | Accessibility, performance, states and control remain mandatory.          |
      | Example and governance  | Causal traceability and validation of stories are added.                              | The calculus tutor and the control points keep their purpose.             |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-13:
    sourceHash: fbf3e33e1c49741aed30416932f736891d27744c9fdf49ea72123f2f9229fadc
    state: aprobada
    text: Version 2.1 preserves the thesis, the ten principles, the doctrine for AI, the Job Stories and the worked example. It extends the core to accommodate product definitions of differing form, length and depth, without imposing a structure upstream or assuming an incremental strategy.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-14:
    sourceHash: d5ff5168823ec9b72198160d56c72e361c1b70fbad36e509373d0b4e1ea43ea5
    state: aprobada
    text: |-
      | **Area**               | **Adjustment in version 2.1**                                                                | **Content that remains**                                                          |
      |------------------------|-----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
      | Foundation             | An authorised, traceable and verifiable base is defined, which may take different forms.        | Human progress continues as the principal measure.                                |
      | Job Stories            | They are declared a reference form, not a universally mandatory structure.                      | Their canonical form, evidence, tests and examples are preserved.                 |
      | Scope                  | Full coverage is required and unauthorised omissions or deferrals are prohibited.               | Product continues to define scope and non-goals.                                  |
      | Planning               | Breakdown, sequence and parallelism are separated from any scope decision.                      | Prior clarity, rules, risks and acceptance continue.                              |
      | Delivery strategy      | Incrementality ceases to be an assumption of the core.                                          | Each project may adopt phases or releases where appropriate.                      |
      | SDD implementation     | It is reserved for independent annexes and adapters.                                            | The core keeps principles and guarantees that every implementation must respect.  |
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  sh-done:
    sourceHash: 2a8713d4c86320daa8f228f47a4c4be1e8a17ed4895f39ca86ca6cd04d856a0a
    state: aprobada
    text: "#### Definition of done · `SH-DONE`"
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-16:
    sourceHash: fd1e0be577415e03722ed6933bcebedde8d7c2c11c77831daeed17ece434202b
    state: aprobada
    text: A development is complete when every mandatory element of the product definition has an implementation and verifiable evidence, or an explicit and approved exception; when people achieve the intended outcomes under the defined conditions; and when the system's behaviour and the quality of the experience have been verified with rigour proportionate to the risk.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
  gobernanza-17:
    sourceHash: 9c8aee8f9b8fb51d4573effef52445d02d3131761ca6fa84efc03d494290d453
    state: aprobada
    text: Where the foundation includes Job Stories, verification must demonstrate the outcome in their circumstances. Completeness includes correct code, but it does not end there. It requires coverage of the scope, integration between its parts, dependable critical states, an experience that does not force anyone to learn the product's architecture, AI within explicit limits, and clarity about what must be observed after launch.
    approvedBy: Damián Acuña
    approvedAt: 2026-09-28
