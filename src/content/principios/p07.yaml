entries:
  tension:
    id: p07-tension
    type: explanation
    derivedFrom: principio-7-07
    text:
      es:
        state: borrador
        text: La incertidumbre frena la acción. Con IA, además, una respuesta fluida puede ocultar sus límites y hacer difícil distinguir un hecho de una inferencia.
      en:
        state: pendiente
      pt-BR:
        state: pendiente
  significado:
    id: p07-significado
    type: explanation
    derivedFrom: principio-7-05
    text:
      es:
        state: borrador
        text: "La confianza no se promete: surge de una conducta predecible. El producto muestra su estado, anticipa consecuencias, confirma resultados y ofrece una forma de recuperarse."
      en:
        state: pendiente
      pt-BR:
        state: pendiente
  consecuencia:
    id: p07-consecuencia
    type: explanation
    derivedFrom: principio-7-09
    text:
      es:
        state: borrador
        text: Se distinguen con claridad recomendaciones, decisiones automáticas y resultados confirmados. Antes de una acción irreversible la persona sabe qué va a cambiar y, cuando es razonable, puede deshacer o volver a un estado seguro.
      en:
        state: pendiente
      pt-BR:
        state: pendiente
  ejemplo:
    id: p07-ejemplo
    type: example
    derivedFrom: p07
    text:
      es:
        state: borrador
        text: Este sitio rotula cada bloque según lo que es —texto canónico, explicación, ejemplo o estado técnico— para que quien lee sepa qué está citando.
      en:
        state: pendiente
      pt-BR:
        state: pendiente
  contraejemplo:
    id: p07-contraejemplo
    type: counterexample
    derivedFrom: principio-7-12
    text:
      es:
        state: borrador
        text: Presentar una adaptación independiente como oficial, publicada o respaldada por una empresa que no la respalda.
      en:
        state: pendiente
      pt-BR:
        state: pendiente
  prueba:
    id: p07-prueba
    type: decision-test
    derivedFrom: principio-7-11
    text:
      es:
        state: borrador
        text: Estas preguntas comprueban si la confianza descansa en evidencia o en el tono.
      en:
        state: pendiente
      pt-BR:
        state: pendiente
