# P05 · contrato del PRD §17. Nombre, frase, reglas, pruebas y señal se citan del núcleo (#p05).
id: P05
canonicalNode: p05
jobStories:
  - JS-03
  - JS-04
  - JS-08
  - JS-09
requirements:
  - FR-004
  - FR-005
  - FR-006
entries:
  tension:
    id: p05-tension
    type: explanation
    derivedFrom: principio-5-07
    text:
      es:
        state: borrador
        text: Cada convención propia que hay que memorizar consume la capacidad que la persona necesitaba para su problema real. En productos de uso infrecuente, o con contenido difícil, esa carga es especialmente dañina.
      en:
        state: borrador
        text: Every custom convention that has to be memorised consumes the capacity the person needed for their real problem. In infrequently used products, or those with difficult content, that burden is especially damaging.
      pt-BR:
        state: borrador
        text: Cada convenção própria que é preciso memorizar consome a capacidade de que a pessoa precisava para seu problema real. Em produtos de uso pouco frequente, ou com conteúdo difícil, essa carga é especialmente danosa.
  significado:
    id: p05-significado
    type: explanation
    derivedFrom: principio-5-05
    text:
      es:
        state: borrador
        text: La interfaz se apoya en expectativas conocidas, jerarquía comprensible y respuesta inmediata. Quien llega viene a hacer su trabajo, no a aprender el del equipo.
      en:
        state: borrador
        text: The interface builds on familiar expectations, an understandable hierarchy and immediate feedback. People come to do their work, not to learn the team's.
      pt-BR:
        state: borrador
        text: A interface se apoia em expectativas conhecidas, hierarquia compreensível e resposta imediata. Quem chega veio fazer seu trabalho, não aprender o do time.
  consecuencia:
    id: p05-consecuencia
    type: explanation
    derivedFrom: principio-5-09
    text:
      es:
        state: borrador
        text: Se prefieren patrones conocidos cuando resuelven bien el problema. La acción principal, el estado actual y el siguiente paso posible tienen que ser evidentes sin un tutorial previo.
      en:
        state: borrador
        text: Known patterns are preferred where they solve the problem well. The primary action, the current state and the next possible step must be evident without a prior tutorial.
      pt-BR:
        state: borrador
        text: Padrões conhecidos são preferidos quando resolvem bem o problema. A ação principal, o estado atual e o próximo passo possível têm de ser evidentes sem um tutorial prévio.
  ejemplo:
    id: p05-ejemplo
    type: example
    derivedFrom: p05
    text:
      es:
        state: borrador
        text: Una navegación que nombra cada destino por lo que contiene («Manifiesto», «Principios», «Aplicación») permite elegir sin haber recorrido nada antes.
      en:
        state: borrador
        text: Navigation that names each destination by what it contains (“Manifesto”, “Principles”, “Application”) lets people choose without having gone through anything first.
      pt-BR:
        state: borrador
        text: Uma navegação que nomeia cada destino pelo que ele contém (“Manifesto”, “Princípios”, “Aplicação”) permite escolher sem ter percorrido nada antes.
  contraejemplo:
    id: p05-contraejemplo
    type: counterexample
    derivedFrom: principio-5-12
    text:
      es:
        state: borrador
        text: Obligar a descubrir cómo avanzar, o a interpretar gestos ocultos, antes de poder leer.
      en:
        state: borrador
        text: Forcing people to work out how to move forward, or to interpret hidden gestures, before they can read.
      pt-BR:
        state: borrador
        text: Obrigar a descobrir como avançar, ou a interpretar gestos ocultos, antes de poder ler.
  prueba:
    id: p05-prueba
    type: decision-test
    derivedFrom: principio-5-11
    text:
      es:
        state: borrador
        text: Estas preguntas detectan el aprendizaje que la interfaz agrega sin que el problema lo pida.
      en:
        state: borrador
        text: These questions detect the learning that the interface adds without the problem calling for it.
      pt-BR:
        state: borrador
        text: Estas perguntas detectam o aprendizado que a interface acrescenta sem que o problema o exija.
