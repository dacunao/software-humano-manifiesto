# P06 · contrato del PRD §17. Nombre, frase, reglas, pruebas y señal se citan del núcleo (#p06).
id: P06
canonicalNode: p06
jobStories:
  - JS-01
  - JS-03
  - JS-04
requirements:
  - FR-004
  - FR-005
  - FR-006
entries:
  tension:
    id: p06-tension
    type: explanation
    derivedFrom: principio-6-07
    text:
      es:
        state: borrador
        text: Menús, alertas, animaciones, elecciones y textos compiten por la misma atención, que es finita. Una interfaz puede no tener errores y aun así fracasar por saturación.
      en:
        state: borrador
        text: Menus, alerts, animations, choices, and copy compete for the same attention, which is finite. An interface may have no errors and still fail because of saturation.
      pt-BR:
        state: borrador
        text: Menus, alertas, animações, escolhas e textos competem pela mesma atenção, que é finita. Uma interface pode não ter erros e, ainda assim, fracassar por saturação.
  significado:
    id: p06-significado
    type: explanation
    derivedFrom: principio-6-05
    text:
      es:
        state: borrador
        text: "La atención se administra con la misma disciplina que el rendimiento o el costo: cada elemento visible y cada decisión solicitada tienen que justificar lo que consumen."
      en:
        state: borrador
        text: "Attention is managed with the same discipline as performance or cost: every visible element and every requested decision must justify what they consume."
      pt-BR:
        state: borrador
        text: "A atenção é administrada com a mesma disciplina que o desempenho ou o custo: cada elemento visível e cada decisão solicitada têm que justificar o que consomem."
  consecuencia:
    id: p06-consecuencia
    type: explanation
    derivedFrom: principio-6-09
    text:
      es:
        state: borrador
        text: Se jerarquiza por relevancia para el momento actual, no por igualdad entre funcionalidades. Las señales intensas se reservan para lo que de verdad requiere atención.
      en:
        state: borrador
        text: Hierarchy is established based on relevance to the current moment, not on equality among features. High-intensity signals are reserved for what truly requires attention.
      pt-BR:
        state: borrador
        text: Hierarquiza-se pela relevância para o momento atual, não pela igualdade entre funcionalidades. Os sinais intensos são reservados para o que realmente exige atenção.
  ejemplo:
    id: p06-ejemplo
    type: example
    derivedFrom: p06
    text:
      es:
        state: borrador
        text: Una página con una idea dominante por sección y una sola acción principal deja claro qué hacer después, sin pedir que la persona ordene opciones que el producto podía ordenar.
      en:
        state: borrador
        text: A page with one dominant idea per section and a single primary action makes it clear what to do next, without asking the person to organize options that the product could have organized.
      pt-BR:
        state: borrador
        text: Uma página com uma ideia dominante por seção e uma única ação principal deixa claro o que fazer em seguida, sem pedir que a pessoa organize opções que o produto poderia ter organizado.
  contraejemplo:
    id: p06-contraejemplo
    type: counterexample
    derivedFrom: principio-6-12
    text:
      es:
        state: borrador
        text: Animaciones continuas, llamados simultáneos con el mismo peso o fondos que reducen la legibilidad del texto.
      en:
        state: borrador
        text: Continuous animations, simultaneous calls to action with the same weight, or backgrounds that reduce text readability.
      pt-BR:
        state: borrador
        text: Animações contínuas, chamadas simultâneas com o mesmo peso ou fundos que reduzem a legibilidade do texto.
  prueba:
    id: p06-prueba
    type: decision-test
    derivedFrom: principio-6-11
    text:
      es:
        state: borrador
        text: Estas preguntas ayudan a decidir qué puede quitarse sin perder información ni control.
      en:
        state: borrador
        text: These questions help determine what may be removed without losing information or control.
      pt-BR:
        state: borrador
        text: Estas perguntas ajudam a decidir o que pode ser removido sem perder informação nem controle.
