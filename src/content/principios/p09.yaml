# P09 · contrato del PRD §17. Nombre, frase, reglas, pruebas y señal se citan del núcleo (#p09).
id: P09
canonicalNode: p09
jobStories:
  - JS-03
requirements:
  - FR-004
  - FR-005
  - FR-006
entries:
  tension:
    id: p09-tension
    type: explanation
    derivedFrom: principio-9-07
    text:
      es:
        state: aprobado
        text: "La lentitud cambia la conducta: provoca clics repetidos, dudas y abandono. Perder un avance obliga a reconstruir el contexto y destruye la confianza muy rápido."
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: "Slowness changes behavior: it causes repeated clicks, doubt, and abandonment. Losing progress forces people to reconstruct context and destroys trust very quickly."
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: "A lentidão muda o comportamento: provoca cliques repetidos, dúvidas e abandono. Perder o progresso feito obriga a reconstruir o contexto e destrói a confiança muito rapidamente."
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
  significado:
    id: p09-significado
    type: explanation
    derivedFrom: principio-9-05
    text:
      es:
        state: aprobado
        text: Latencia, disponibilidad y preservación del trabajo son propiedades de la experiencia. Quien usa el producto no distingue entre infraestructura e interfaz cuando algo tarda o se pierde.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: Latency, availability, and preservation of work are properties of the experience. The person using the product does not distinguish between infrastructure and interface when something takes time or is lost.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Latência, disponibilidade e preservação do trabalho são propriedades da experiência. A pessoa que usa o produto não distingue entre infraestrutura e interface quando algo demora ou se perde.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
  consecuencia:
    id: p09-consecuencia
    type: explanation
    derivedFrom: principio-9-09
    text:
      es:
        state: aprobado
        text: Las interacciones críticas tienen presupuestos de respuesta explícitos. Si una operación puede demorarse se muestra progreso honesto, y el trabajo se guarda con una frecuencia proporcional al costo de perderlo.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: Critical interactions have explicit response budgets. If an operation may take time, honest progress is shown, and work is saved at a frequency proportional to the cost of losing it.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: As interações críticas têm orçamentos de resposta explícitos. Se uma operação pode demorar, mostra-se um progresso honesto, e o trabalho é salvo com uma frequência proporcional ao custo de perdê-lo.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
  ejemplo:
    id: p09-ejemplo
    type: example
    derivedFrom: p09
    text:
      es:
        state: aprobado
        text: El contenido de este sitio llega como texto antes de que se ejecute cualquier script; si un script falla, la lectura sigue.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: The content of this site arrives as text before any script runs; if a script fails, reading continues.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: O conteúdo deste site chega como texto antes que qualquer script seja executado; se um script falhar, a leitura continua.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
  contraejemplo:
    id: p09-contraejemplo
    type: counterexample
    derivedFrom: principio-9-12
    text:
      es:
        state: aprobado
        text: Bloquear la lectura hasta que termine una animación o se descarguen tipografías y recursos pesados.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: Blocking reading until an animation finishes or fonts and heavy resources are downloaded.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Bloquear a leitura até que uma animação termine ou que fontes e recursos pesados sejam baixados.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
  prueba:
    id: p09-prueba
    type: decision-test
    derivedFrom: principio-9-11
    text:
      es:
        state: aprobado
        text: Estas preguntas tratan el tiempo y la continuidad como parte de lo que se entrega.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: These questions treat time and continuity as part of what is delivered.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Estas perguntas tratam o tempo e a continuidade como parte do que é entregue.
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
