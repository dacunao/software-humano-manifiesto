# P04 · contrato del PRD §17. Nombre, frase, reglas, pruebas y señal se citan del núcleo (#p04).
id: P04
canonicalNode: p04
jobStories:
  - JS-03
  - JS-04
  - JS-09
requirements:
  - FR-004
  - FR-005
  - FR-006
entries:
  tension:
    id: p04-tension
    type: explanation
    derivedFrom: principio-4-07
    text:
      es:
        state: borrador
        text: Un producto mínimo puede ser fácil el primer día y limitante el décimo. Uno que muestra toda su potencia desde el inicio puede resultar inabordable. Los dos extremos fallan, por razones opuestas.
      en:
        state: borrador
        text: A minimal product can be easy on day one and limiting on day ten. One that displays all of its power from the outset can be unapproachable. Both extremes fail, for opposite reasons.
      pt-BR:
        state: borrador
        text: Um produto mínimo pode ser fácil no primeiro dia e limitante no décimo. Um produto que mostra toda a sua potência desde o início pode ser inabordável. Os dois extremos falham, por razões opostas.
  significado:
    id: p04-significado
    type: explanation
    derivedFrom: principio-4-05
    text:
      es:
        state: borrador
        text: "La simplicidad no reduce la capacidad: decide cuándo aparece. Lo visible se adapta al momento, a la experiencia y a la decisión actual, y la profundidad queda disponible sin imponerse."
      en:
        state: borrador
        text: "Simplicity does not reduce capability: it decides when that capability appears. What is visible adapts to the moment, the level of experience and the decision at hand, and depth remains available without being imposed."
      pt-BR:
        state: borrador
        text: "A simplicidade não reduz a capacidade: decide quando ela aparece. O que está visível se adapta ao momento, à experiência e à decisão atual, e a profundidade fica disponível sem se impor."
  consecuencia:
    id: p04-consecuencia
    type: explanation
    derivedFrom: principio-4-09
    text:
      es:
        state: borrador
        text: Primero se muestra la ruta principal; las opciones avanzadas aparecen cuando el contexto las vuelve relevantes. Los valores predeterminados se eligen con cuidado y pueden cambiarse cuando la decisión importa.
      en:
        state: borrador
        text: The main route is shown first; advanced options appear when the context makes them relevant. Defaults are chosen with care and can be changed where the decision matters.
      pt-BR:
        state: borrador
        text: Primeiro se mostra o caminho principal; as opções avançadas aparecem quando o contexto as torna relevantes. Os valores padrão são escolhidos com cuidado e podem ser alterados quando a decisão importa.
  ejemplo:
    id: p04-ejemplo
    type: example
    derivedFrom: p04
    text:
      es:
        state: borrador
        text: Cada principio de este sitio se entiende en su página sin abrir nada; quien quiere el texto completo, las reglas o las pruebas los encuentra a un paso, en el mismo lugar.
      en:
        state: borrador
        text: Each principle on this site can be understood on its own page without opening anything; anyone who wants the full text, the rules or the tests finds them one step away, in the same place.
      pt-BR:
        state: borrador
        text: Cada princípio deste site é compreendido em sua página sem abrir nada; quem quer o texto completo, as regras ou os testes os encontra a um passo, no mesmo lugar.
  contraejemplo:
    id: p04-contraejemplo
    type: counterexample
    derivedFrom: principio-4-12
    text:
      es:
        state: borrador
        text: Una portada mínima que oculta el contenido, o una página inicial que lo muestra todo a la vez.
      en:
        state: borrador
        text: A minimal front page that hides the content, or a home page that shows everything at once.
      pt-BR:
        state: borrador
        text: Uma capa mínima que oculta o conteúdo, ou uma página inicial que mostra tudo de uma vez.
  prueba:
    id: p04-prueba
    type: decision-test
    derivedFrom: principio-4-11
    text:
      es:
        state: borrador
        text: Estas preguntas distinguen la simplificación que quita ruido de la que quita capacidad.
      en:
        state: borrador
        text: These questions distinguish simplification that removes noise from simplification that removes capability.
      pt-BR:
        state: borrador
        text: Estas perguntas distinguem a simplificação que tira ruído da que tira capacidade.
