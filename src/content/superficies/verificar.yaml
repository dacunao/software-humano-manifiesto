# División 5 · Verificar (PRD v1.2 §18.1, FR-022, RQ-15): Verificación y Antipatrones.
id: verificar
title:
  es:
    state: borrador
    text: "Verificar"
  en:
    state: borrador
    text: "Verify"
  pt-BR:
    state: borrador
    text: "Verificar"
description:
  es:
    state: borrador
    text: "Doce dimensiones para aceptar una solución, un puntaje de decisión y las señales de que el producto se aleja del manifiesto."
  en:
    state: borrador
    text: "Twelve dimensions for accepting a solution, a decision scorecard and the signs that a product is drifting from the manifesto."
  pt-BR:
    state: borrador
    text: "Doze dimensões para aceitar uma solução, um placar de decisão e os sinais de que o produto se afasta do manifesto."
fr:
  - FR-022
sections:
  - id: dimensiones
    title:
      es:
        state: borrador
        text: Doce dimensiones para aceptar una solución
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: verificacion-dimensiones
          type: explanation
          derivedFrom: verificacion-03
          text:
            es:
              state: borrador
              text: "Aceptar exige evidencia. Que una pantalla se vea limpia o que el código compile no demuestra que el producto cumpla su propósito: la cobertura, el progreso, la comprensión, la carga, la confianza, el control y los estados también se verifican."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: verificacion-03
        hasta: verificacion-04
  - id: sh-score
    title:
      es:
        state: borrador
        text: Un puntaje para orientar la conversación
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: verificacion-scorecard
          type: explanation
          derivedFrom: verificacion-06
          text:
            es:
              state: borrador
              text: "Once criterios se puntúan de 0 a 2. El puntaje no reemplaza el juicio: ordena la conversación y marca lo que no puede quedar en cero."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: verificacion-06
        hasta: verificacion-08
  - id: revision
    title:
      es:
        state: borrador
        text: Preguntas para una revisión de producto
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: verificacion-revision
          type: explanation
          derivedFrom: verificacion-10
          text:
            es:
              state: borrador
              text: "Once preguntas para revisar una decisión de producto, incluida la más difícil: qué haría rechazar una implementación aunque funcione técnicamente."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        nodos:
          - verificacion-10
  - id: sh-ap
    title:
      es:
        state: borrador
        text: Señales de que el producto se aleja
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: verificacion-antipatrones
          type: explanation
          derivedFrom: antipatrones-03
          text:
            es:
              state: borrador
              text: "Catorce antipatrones, cada uno con la forma en que aparece y su respuesta, y una advertencia: la simplicidad también puede ser una excusa para ocultar lo necesario."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: antipatrones-03
        hasta: antipatrones-06
