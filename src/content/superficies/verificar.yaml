          id: verificacion-antipatrones
          type: explanation
          derivedFrom: antipatrones-03
          text:
            es:
              state: aprobado
              text: "Catorce antipatrones, cada uno con la forma en que aparece y su respuesta, y una advertencia: la simplicidad también puede ser una excusa para ocultar lo necesario."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "Fourteen anti-patterns, each with the form it takes and its response, and a warning: simplicity may also be an excuse to hide what is necessary."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "Catorze antipadrões, cada um com a forma como aparece e sua resposta, e uma advertência: a simplicidade também pode ser uma desculpa para ocultar o necessário."
