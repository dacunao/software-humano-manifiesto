          type: explanation
          derivedFrom: verificacion-10
          text:
            es:
              state: aprobado
              text: "Once preguntas para revisar una decisión de producto, incluida la más difícil: qué haría rechazar una implementación aunque funcione técnicamente."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "Eleven questions for reviewing a product decision, including the hardest one: what would cause an implementation to be rejected even if it works technically."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "Onze perguntas para revisar uma decisão de produto, incluindo a mais difícil: o que faria uma implementação ser rejeitada mesmo que funcione tecnicamente."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        nodos:
