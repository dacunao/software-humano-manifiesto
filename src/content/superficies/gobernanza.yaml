    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-practica
          type: explanation
          derivedFrom: gobernanza-03
          text:
            es:
              state: aprobado
              text: "El manifiesto pierde valor si queda en una presentación inicial. Tiene que aparecer donde el equipo decide: cada rol tiene una obligación principal, y cada momento del desarrollo —antes de diseñar, de generar código, de integrar, de liberar y después— tiene una decisión que no se puede saltar."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "The manifesto loses value if it never goes beyond a kickoff presentation. It must appear wherever the team makes decisions: each role has one primary obligation, and each stage of development—before designing, generating code, integrating, releasing, and afterward—has a decision that cannot be skipped."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "O manifesto perde valor se ficar em uma apresentação inicial. Ele tem que aparecer onde o time decide: cada função tem uma obrigação principal, e cada momento do desenvolvimento —antes de projetar, de gerar código, de integrar, de liberar e depois— tem uma decisão que não pode ser ignorada."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: gobernanza-03
        hasta: gobernanza-07
  - id: evolucion
    title:
