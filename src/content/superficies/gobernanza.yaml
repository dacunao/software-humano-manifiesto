        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: How the manifesto changes
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Como o manifesto muda
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: acerca-evolucion
          type: explanation
          derivedFrom: gobernanza-09
          text:
            es:
              state: aprobado
              text: Los principios son estables; las reglas y las pruebas pueden cambiar con evidencia nueva. Cada versión registra qué problema resolvió y qué conserva de la anterior.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: The principles are stable; the rules and tests may change with new evidence. Each version records what problem it solved and what it retains from the previous version.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: Os princípios são estáveis; as regras e os testes podem mudar com nova evidência. Cada versão registra qual problema resolveu e o que conserva da anterior.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: gobernanza-09
        hasta: gobernanza-14
  - id: sh-done
    title:
      es:
        state: aprobado
        text: Qué significa terminado
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: What it means to be done
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: O que significa estar concluído
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-terminado
          type: explanation
          derivedFrom: sh-done
          text:
            es:
              state: aprobado
              text: Un desarrollo está terminado cuando cada elemento obligatorio tiene implementación y evidencia, o una excepción aprobada, y las personas alcanzan los resultados previstos. El código correcto forma parte de esa completitud; no la agota.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: Development is done when every required element has an implementation and evidence, or an approved exception, and people achieve the intended outcomes. Correct code is part of that completeness; it does not exhaust it.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: Um desenvolvimento está concluído quando cada elemento obrigatório tem implementação e evidência, ou uma exceção aprovada, e as pessoas alcançam os resultados previstos. O código correto faz parte dessa completude; não a esgota.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        nodos:
          - gobernanza-16
          - gobernanza-17
