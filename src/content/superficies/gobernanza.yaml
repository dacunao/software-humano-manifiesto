          type: explanation
          derivedFrom: gobernanza-03
          text:
            es:
              state: borrador
              text: "El manifiesto pierde valor si queda en una presentación inicial. Tiene que aparecer donde el equipo decide: cada rol tiene una obligación principal, y cada momento del desarrollo —antes de diseñar, de generar código, de integrar, de liberar y después— tiene una decisión que no se puede saltar."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: gobernanza-03
        hasta: gobernanza-07
  - id: evolucion
    title:
      es:
        state: borrador
        text: Cómo cambia el manifiesto
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: acerca-evolucion
          type: explanation
          derivedFrom: gobernanza-09
          text:
            es:
              state: borrador
              text: Los principios son estables; las reglas y las pruebas pueden cambiar con evidencia nueva. Cada versión registra qué problema resolvió y qué conserva de la anterior.
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: gobernanza-09
        hasta: gobernanza-14
  - id: sh-done
    title:
      es:
        state: borrador
        text: Qué significa terminado
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-terminado
          type: explanation
          derivedFrom: sh-done
          text:
            es:
              state: borrador
              text: Un desarrollo está terminado cuando cada elemento obligatorio tiene implementación y evidencia, o una excepción aprobada, y las personas alcanzan los resultados previstos. El código correcto forma parte de esa completitud; no la agota.
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        nodos:
          - gobernanza-16
          - gobernanza-17
