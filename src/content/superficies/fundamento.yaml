      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-job-stories
          type: explanation
          derivedFrom: fundamento-de-producto-y-forma-de-referencia-13
          text:
            es:
              state: borrador
              text: "Las Job Stories describen el progreso: cuándo surge una necesidad, qué la motiva y qué resultado se busca, sin anticipar la solución. Son la forma de referencia del manifiesto, no una obligación. Un fundamento puede llegar como épicas, requisitos o recorridos, y el método tiene que respetar esa forma en lugar de convertirla."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
