# Superficie «speckit» (PRD §18.1). Títulos y descripciones en borrador.
id: speckit
title:
  es:
    state: borrador
    text: SpecKit
  en:
    state: borrador
    text: SpecKit
  pt-BR:
    state: borrador
    text: SpecKit
description:
  es:
    state: borrador
    text: Una implementación de referencia independiente del manifiesto sobre SpecKit, su estado real y sus límites.
  en:
    state: borrador
    text: An independent reference implementation of the manifesto on SpecKit, its actual status and its limits.
  pt-BR:
    state: borrador
    text: Uma implementação de referência independente do manifesto sobre o SpecKit, seu status real e seus limites.
fr:
  - FR-008
  - FR-009
  - FR-010
sections:
  - id: que-es
    title:
      es: { state: borrador, text: "Qué es y qué no es" }
      en: &pend { state: pendiente }
      pt-BR: *pend
    blocks:
      - kind: entrada
        entrada:
          id: speckit-que-es
          type: explanation
          derivedFrom: proposito-del-documento-13
          text:
            es:
              state: borrador
              text: >-
                SpecKit es una herramienta de desarrollo guiado por especificaciones: ordena el trabajo en especificar, aclarar, planificar, dividir en tareas, analizar, implementar y converger. No define el manifiesto ni el producto. La adaptación Software Humano lo usa para que la doctrina esté presente mientras un agente de código trabaja. Es una forma de aplicar el manifiesto, no el manifiesto.
            en: *pend
            pt-BR: *pend
    depth:
      - kind: canon
        nodos: [proposito-del-documento-13, proposito-del-documento-21]
  - id: capas
    title:
      es: { state: borrador, text: 'Cuatro capas, cada una con su autoridad' }
      en: *pend
      pt-BR: *pend
    blocks:
      - kind: entrada
        entrada:
          id: speckit-capas
          type: explanation
          derivedFrom: proposito-del-documento-21
          text:
            es:
              state: borrador
              text: |-
                - **El núcleo del manifiesto** gobierna los principios, el flujo, los artefactos y los criterios de aceptación.
                - **La constitución operativa** es el núcleo completo, instalado donde el agente lo lee antes de cada operación. Condiciona su actuación.
                - **El anexo de aplicación** define cómo se corresponde cada obligación del núcleo con una operación de SpecKit.
                - **El preset, la extensión y el workflow Software Humano** materializan esa correspondencia. El preset agrega a cada operación lo que el manifiesto exige en ella; la extensión comprueba que los artefactos lo tengan; el workflow pone las compuertas que el manifiesto nombra.
                - **SpecKit nativo** conserva su comportamiento en todo lo que la adaptación no toca.
            en: *pend
            pt-BR: *pend
  - id: conserva
    title:
      es: { state: borrador, text: "Qué conserva y qué cambia" }
      en: *pend
      pt-BR: *pend
    blocks:
      - kind: entrada
        entrada:
          id: speckit-conserva
          type: explanation
          derivedFrom: proposito-del-documento-21
          text:
            es:
              state: borrador
              text: >-
                Los comandos nativos conservan su descripción, su encadenamiento y sus scripts, y la lista de verificación nativa queda intacta. Lo que cambia es el contenido de las plantillas: cada operación incorpora, citado textualmente del núcleo, lo que el manifiesto exige en ese momento, y los artefactos del núcleo aparecen donde corresponden. Nada de esto requiere modificar el código de SpecKit.
            en: *pend
            pt-BR: *pend
  - id: estado
    title:
      es: { state: borrador, text: "Estado actual" }
      en: *pend
      pt-BR: *pend
    blocks:
      - kind: estado-adaptacion
