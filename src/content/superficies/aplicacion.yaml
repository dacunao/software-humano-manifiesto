# Superficie «aplicacion» · ruta Construir (PRD v1.1 §18.1). Casa de doctrina, flujo, artefactos, detención, contrato, práctica y ejemplo (§18.3).
id: aplicacion
title:
  es:
    state: borrador
    text: Aplicación
  en:
    state: borrador
    text: In practice
  pt-BR:
    state: borrador
    text: Aplicação
description:
  es:
    state: borrador
    text: "Cómo el manifiesto se vuelve práctica: fundamento, flujo, artefactos, contrato del agente, detenciones y terminado."
  en:
    state: borrador
    text: "How the manifesto becomes practice: product foundation, flow, artifacts, agent contract, stops and definition of done."
  pt-BR:
    state: borrador
    text: "Como o manifesto se torna prática: fundamento, fluxo, artefatos, contrato do agente, paradas e definição de pronto."
fr:
  - FR-007
sections:
  - id: doctrina
    title:
      es:
        state: borrador
        text: Cuando construir cuesta menos
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-doctrina
          type: explanation
          derivedFrom: doctrina-para-desarrollo-con-ia-03
          text:
            es:
              state: borrador
              text: "La IA abarata construir y, con eso, mueve el cuello de botella: la pregunta deja de ser si algo puede hacerse y pasa a ser si merece existir. Seis directivas ponen límites al trabajo de equipos y agentes, y una tabla separa lo que debe ser determinista de lo que admite generación."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: doctrina-para-desarrollo-con-ia-03
        hasta: doctrina-para-desarrollo-con-ia-13
  - id: flujo
    title:
      es:
        state: borrador
        text: Un flujo del fundamento a la verificación
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-flujo
          type: explanation
          derivedFrom: flujo-de-trabajo-03
          text:
            es:
              state: borrador
              text: "El flujo evita que generar código sea el primer acto de diseño. Ocho pasos llevan del fundamento a una solución verificable: comprender, establecer cobertura, planificar, concretar el progreso, definir la experiencia, modelar reglas y riesgos, explorar, y construir verificando. Descomponer el trabajo no autoriza a omitir parte del alcance."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: flujo-de-trabajo-03
        hasta: flujo-de-trabajo-04
  - id: artefactos
    title:
      es:
        state: borrador
        text: Artefactos que responden preguntas
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-artefactos
          type: explanation
          derivedFrom: flujo-de-trabajo-06
          text:
            es:
              state: borrador
              text: Cada artefacto existe para responder una pregunta, no para llenar una plantilla. Si la información ya existe, se referencia. Si un artefacto no cambia una decisión ni ayuda a verificarla, sobra.
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: flujo-de-trabajo-06
        hasta: flujo-de-trabajo-07
  - id: detenciones
    title:
      es:
        state: borrador
        text: Cuándo detenerse
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-detenciones
          type: explanation
          derivedFrom: sh-stop
          text:
            es:
              state: borrador
              text: Un agente no debería empezar a construir si no puede decir cuál es el fundamento, qué alcance establece, qué evidencia lo respalda y qué tiene que decidir la persona. Las siete razones para detener una implementación que ya está en marcha están en [Verificación](/es/verificacion#bolsillo).
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: flujo-de-trabajo-09
        hasta: flujo-de-trabajo-11
  - id: contrato
    title:
      es:
        state: borrador
        text: El contrato del agente
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-contrato
          type: explanation
          derivedFrom: contrato-reutilizable-03
          text:
            es:
              state: borrador
              text: "Ocho instrucciones que pueden incorporarse a un repositorio o al pedido que recibe un agente de código: construir lo más simple que cumpla, comprender antes de programar, dar cuenta de todo el alcance, proponer con alternativas, no exponer estructuras internas, usar la IA con límites, no agregar lo que nadie pidió y reconciliar antes de declarar terminado."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: contrato-reutilizable-03
        hasta: contrato-reutilizable-23
  - id: practica
    title:
      es:
        state: borrador
        text: Una práctica habitual
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-practica
          type: explanation
          derivedFrom: gobernanza-03
          text:
            es:
              state: borrador
              text: "El manifiesto pierde valor si queda en una presentación inicial. Tiene que aparecer donde el equipo decide: cada rol tiene una obligación principal, y cada momento del desarrollo —antes de diseñar, de generar código, de integrar, de liberar y después— tiene una decisión que no se puede saltar."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: gobernanza-03
        hasta: gobernanza-07
  - id: ejemplo
    title:
      es:
        state: borrador
        text: Un ejemplo aplicado
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: aplicacion-ejemplo
          type: explanation
          derivedFrom: ejemplo-aplicado-03
          text:
            es:
              state: borrador
              text: "Un tutor de cálculo recorre todo el método: de un pedido de función a la circunstancia real, del diagnóstico al rediseño, y de lo que debe ser determinista a lo que puede asistir la IA."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: ejemplo-aplicado-02
        hasta: ejemplo-aplicado-23
