# División 0 · Mapa del manifiesto (PRD v1.2 §18.1, RQ-15): portada del núcleo e índice operativo.
id: mapa
title:
  es:
    state: borrador
    text: "Mapa del manifiesto"
  en:
    state: borrador
    text: Manifesto map
  pt-BR:
    state: borrador
    text: Mapa do manifesto
description:
  es:
    state: borrador
    text: "La portada del núcleo, sus identificadores y el recorrido completo por sus nueve divisiones."
  en:
    state: borrador
    text: The core's cover page, its identifiers, and the complete journey through its nine divisions.
  pt-BR:
    state: borrador
    text: A capa do núcleo, seus identificadores e o percurso completo por suas nove divisões.
fr:
  - FR-003
sections:
  - id: portada
    title:
      es:
        state: borrador
        text: "El núcleo"
      en:
        state: borrador
        text: The core
      pt-BR:
        state: borrador
        text: O núcleo
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: mapa-portada
          type: surface-text
          text:
            es:
              state: borrador
              text: "Este es el mapa del núcleo del manifiesto. El núcleo se lee en nueve divisiones, en su orden: cada una reúne secciones completas del documento original, sin partirlas ni repetirlas. Con «Siguiente» se recorre entero, y desde el pie de cada página se puede descargar completo."
            en:
              state: borrador
              text: "This is the map of the manifesto core. The core is read in nine divisions, in order: each one brings together complete sections of the original document, without splitting or repeating them. “Next” takes you through the whole core, and the complete core can be downloaded from the footer of each page."
            pt-BR:
              state: borrador
              text: "Este é o mapa do núcleo do manifesto. O núcleo é lido em nove divisões, em sua ordem: cada uma reúne seções completas do documento original, sem dividi-las nem repeti-las. Com “Próximo”, você percorre o núcleo inteiro, e pode baixá-lo completo pelo rodapé de cada página."
      - kind: canon
        desde: portada-01
        hasta: portada-06
  - id: sh-index
    title:
      es:
        state: borrador
        text: "Índice de identificadores"
      en:
        state: borrador
        text: Identifier index
      pt-BR:
        state: borrador
        text: Índice de identificadores
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: mapa-indice
          type: explanation
          derivedFrom: indice-operativo-para-agentes-02
          text:
            es:
              state: borrador
              text: "Cada obligación del núcleo tiene un identificador estable, como `P03`, `CR05` o `STOP02`, que permite citarla sin ambigüedad. La tabla muestra sus familias; en el sitio, cada identificador lleva a la división donde se lee su pasaje."
            en:
              state: borrador
              text: Every core obligation has a stable identifier, such as `P03`, `CR05`, or `STOP02`, which makes it possible to cite it unambiguously. The table shows their families; on the site, each identifier leads to the division where its passage is read.
            pt-BR:
              state: borrador
              text: Cada obrigação do núcleo tem um identificador estável, como `P03`, `CR05` ou `STOP02`, que permite citá-la sem ambiguidade. A tabela mostra suas famílias; no site, cada identificador leva à divisão em que sua passagem aparece.
      - kind: canon
        desde: indice-operativo-para-agentes-02
        hasta: indice-operativo-para-agentes-04
