    title:
      es:
        state: aprobado
        text: El texto del manifiesto
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: The text of the manifesto
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: O texto do manifesto
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-texto
          type: explanation
          derivedFrom: texto-canonico-02
          text:
            es:
              state: aprobado
              text: La postura del manifiesto cabe en pocos minutos de lectura. Todo lo demás —los principios, el método, la verificación— desarrolla lo que afirman estos párrafos.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: The manifesto's position can be read in a few minutes. Everything else—the principles, the method, the verification—develops what these paragraphs assert.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: A posição do manifesto cabe em poucos minutos de leitura. Todo o resto —os princípios, o método, a verificação— desenvolve o que estes parágrafos afirmam.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: texto-canonico-02
        hasta: texto-canonico-14
