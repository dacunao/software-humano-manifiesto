      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-problema
          type: explanation
          derivedFrom: proposito-del-documento-04
          text:
            es:
              state: borrador
              text: "Antes de proponer nada, el manifiesto nombra el problema: la capacidad de construir crece más rápido que la capacidad de decidir qué merece existir. Su conclusión central separa la función —lo que el software permite hacer— de la experiencia —cuánto de eso puede aprovechar una persona—."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: proposito-del-documento-03
        hasta: proposito-del-documento-09
