# División 1 · El manifiesto (PRD v1.2 §18.1, RQ-15): Propósito del documento y Texto canónico, completos y en su orden.
id: manifiesto
title:
  es:
    state: borrador
    text: "El manifiesto"
  en:
    state: borrador
    text: "The manifesto"
  pt-BR:
    state: borrador
    text: "O manifesto"
description:
  es:
    state: borrador
    text: "El problema que el manifiesto busca resolver, para quién es, cómo leerlo, dónde termina el núcleo y el texto del manifiesto."
  en:
    state: borrador
    text: "The problem the manifesto seeks to solve, who it is for, how to read it, where the core ends and the manifesto text."
  pt-BR:
    state: borrador
    text: "O problema que o manifesto busca resolver, para quem é, como lê-lo, onde termina o núcleo e o texto do manifesto."
fr:
  - FR-003
sections:
  - id: problema
    title:
      es:
        state: borrador
        text: El problema que busca resolver
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-problema
          type: explanation
          derivedFrom: proposito-del-documento-04
          text:
            es:
              state: borrador
              text: "Antes de proponer nada, el manifiesto nombra el problema: la capacidad de construir crece más rápido que la capacidad de decidir qué merece existir. Su conclusión central separa la función —lo que el software permite hacer— de la experiencia —cuánto de eso puede aprovechar una persona—."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: proposito-del-documento-03
        hasta: proposito-del-documento-09
  - id: alcance
    title:
      es:
        state: borrador
        text: Para quién es
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: acerca-alcance
          type: explanation
          derivedFrom: proposito-del-documento-11
          text:
            es:
              state: borrador
              text: "El marco sirve para productos donde la experiencia de uso influye en el resultado, y está pensado para quienes deciden sobre ellos: producto, diseño, desarrollo y agentes de código. No prescribe estilo, tecnología ni método de entrega."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: proposito-del-documento-11
        hasta: proposito-del-documento-13
  - id: rutas
    title:
      es:
        state: borrador
        text: Cuatro maneras de leerlo
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-rutas
          type: surface-text
          text:
            es:
              state: borrador
              text: "El núcleo propone cuatro rutas de lectura, y el sitio las usa para agrupar el índice del manifiesto: **comprender** empieza aquí; **decidir** reúne los [principios](/es/principios) y el [fundamento de producto](/es/manifiesto/fundamento-de-producto); **construir**, la [doctrina, el flujo y el contrato del agente](/es/manifiesto/construir-con-ia); **verificar**, las [pruebas y los antipatrones](/es/manifiesto/verificar). Recorridas en orden, las divisiones reproducen el núcleo completo, que también puedes descargar desde el pie de cada página."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: proposito-del-documento-15
        hasta: proposito-del-documento-16
  - id: arquitectura
    title:
      es:
        state: borrador
        text: Cómo se ordena el marco
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: principios-arquitectura
          type: explanation
          derivedFrom: proposito-del-documento-18
          text:
            es:
              state: borrador
              text: "Cada principio se traduce en niveles que no se sustituyen entre sí: el principio dice qué se cree; el fundamento de producto, qué debe construirse; la Job Story, cuándo surge la necesidad; la regla, qué exige; la prueba, cómo se sabe si se cumplió."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: proposito-del-documento-18
        hasta: proposito-del-documento-19
  - id: limite
    title:
      es:
        state: borrador
        text: "Núcleo e implementación"
      en:
        state: borrador
        text: "Core and implementation"
      pt-BR:
        state: borrador
        text: "Núcleo e implementação"
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-limite
          type: explanation
          derivedFrom: proposito-del-documento-21
          text:
            es:
              state: borrador
              text: "El núcleo fija principios, autoridades y criterios; no prescribe herramientas. Llevarlo a un método o a un framework concreto corresponde a anexos y adaptadores separados, que no pueden modificarlo. La [adaptación para SpecKit](/es/speckit) es uno de ellos."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        nodos:
          - proposito-del-documento-21
  - id: texto
    title:
      es:
        state: borrador
        text: El texto del manifiesto
      en:
        state: pendiente
      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-texto
          type: explanation
          derivedFrom: texto-canonico-02
          text:
            es:
              state: borrador
              text: La postura del manifiesto cabe en pocos minutos de lectura. Todo lo demás —los principios, el método, la verificación— desarrolla lo que afirman estos párrafos.
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: texto-canonico-02
        hasta: texto-canonico-14
