      pt-BR:
        state: pendiente
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-rutas
          type: surface-text
          text:
            es:
              state: borrador
              text: "El núcleo propone cuatro rutas de lectura, y el sitio se organiza igual: **comprender** es esta página; **decidir**, en [Principios](/es/principios); **construir**, en [Aplicación](/es/aplicacion); **verificar**, en [Verificación](/es/verificacion). Para leer el núcleo de corrido, buscar un pasaje o citarlo completo está el [texto íntegro](/es/manifiesto/texto-integro)."
            en:
              state: pendiente
            pt-BR:
              state: pendiente
      - kind: canon
        desde: proposito-del-documento-15
        hasta: proposito-del-documento-16
