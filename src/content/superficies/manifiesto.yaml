sections:
  - id: problema
    title:
      es:
        state: aprobado
        text: El problema que busca resolver
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: The problem it seeks to solve
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: O problema que busca resolver
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-problema
          type: explanation
          derivedFrom: proposito-del-documento-04
          text:
            es:
              state: aprobado
              text: "Antes de proponer nada, el manifiesto nombra el problema: la capacidad de construir crece más rápido que la capacidad de decidir qué merece existir. Su conclusión central separa la función —lo que el software permite hacer— de la experiencia —cuánto de eso puede aprovechar una persona—."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "Before proposing anything, the manifesto names the problem: the capacity to build is growing faster than the capacity to decide what deserves to exist. Its central conclusion separates function—what the software allows a person to do—from experience—how much of that a person can take advantage of."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "Antes de propor qualquer coisa, o manifesto nomeia o problema: a capacidade de construir cresce mais rápido do que a capacidade de decidir o que merece existir. Sua conclusão central separa a função —o que o software permite fazer— da experiência —quanto disso uma pessoa pode aproveitar—."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: proposito-del-documento-03
        hasta: proposito-del-documento-09
  - id: alcance
    title:
      es:
        state: aprobado
        text: Para quién es
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: Who it is for
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Para quem é
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: acerca-alcance
          type: explanation
          derivedFrom: proposito-del-documento-11
          text:
            es:
              state: aprobado
              text: "El marco sirve para productos donde la experiencia de uso influye en el resultado, y está pensado para quienes deciden sobre ellos: producto, diseño, desarrollo y agentes de código. No prescribe estilo, tecnología ni método de entrega."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "The framework is useful for products where the user experience influences the outcome, and it is intended for those who make decisions about them: product, design, development, and coding agents. It prescribes no style, technology, or delivery method."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "O framework serve para produtos em que a experiência de uso influencia o resultado e se destina a quem toma decisões sobre eles: produto, design, desenvolvimento e agentes de código. Ele não prescreve estilo, tecnologia nem método de entrega."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: proposito-del-documento-11
        hasta: proposito-del-documento-13
  - id: rutas
    title:
      es:
        state: aprobado
        text: Cuatro maneras de leerlo
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: Four ways to read it
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Quatro maneiras de lê-lo
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-rutas
          type: surface-text
          text:
            es:
              state: aprobado
              text: "El núcleo propone cuatro rutas de lectura, y el sitio las usa para agrupar el índice del manifiesto: **comprender** empieza aquí; **decidir** reúne los [principios](/es/principios) y el [fundamento de producto](/es/manifiesto/fundamento-de-producto); **construir**, la [doctrina, el flujo y el contrato del agente](/es/manifiesto/construir-con-ia); **verificar**, las [pruebas y los antipatrones](/es/manifiesto/verificar). Recorridas en orden, las divisiones reproducen el núcleo completo, que también puedes descargar desde el pie de cada página."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "The core proposes four reading paths, which the site uses to organize the manifesto index: **understand** begins here; **decide** brings together the [principles](/principles) and the [product foundation](/manifesto/product-foundation); **build**, the [doctrine, workflow, and agent contract](/manifesto/building-with-ai); **verify**, the [tests and anti-patterns](/manifesto/verify). Followed in order, the divisions reproduce the full core, which you may also download from the footer of each page."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "O núcleo propõe quatro rotas de leitura, e o site as usa para agrupar o índice do manifesto: **compreender** começa aqui; **decidir** reúne os [princípios](/pt-br/principios) e o [fundamento de produto](/pt-br/manifesto/fundamento-de-produto); **construir**, a [doutrina, o fluxo e o contrato do agente](/pt-br/manifesto/construir-com-ia); **verificar**, os [testes e os antipadrões](/pt-br/manifesto/verificar). Percorridas em ordem, as divisões reproduzem o núcleo completo, que você também pode baixar pelo rodapé de cada página."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: proposito-del-documento-15
        hasta: proposito-del-documento-16
  - id: arquitectura
    title:
      es:
        state: aprobado
        text: Cómo se ordena el marco
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: How the framework is organized
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Como o framework é organizado
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: principios-arquitectura
          type: explanation
          derivedFrom: proposito-del-documento-18
          text:
            es:
              state: aprobado
              text: "Cada principio se traduce en niveles que no se sustituyen entre sí: el principio dice qué se cree; el fundamento de producto, qué debe construirse; la Job Story, cuándo surge la necesidad; la regla, qué exige; la prueba, cómo se sabe si se cumplió."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "Each principle is translated into levels that do not replace one another: the principle states what is believed; the product foundation, what must be built; the Job Story, when the need arises; the rule, what it requires; the test, how to know whether it was fulfilled."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "Cada princípio se traduz em níveis que não substituem uns aos outros: o princípio diz em que se acredita; o fundamento de produto, o que deve ser construído; a Job Story, quando surge a necessidade; a regra, o que exige; o teste, como se sabe se foi cumprido."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        desde: proposito-del-documento-18
        hasta: proposito-del-documento-19
  - id: limite
    title:
      es:
        state: aprobado
        text: "Núcleo e implementación"
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      en:
        state: aprobado
        text: Core and implementation
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
      pt-BR:
        state: aprobado
        text: Núcleo e implementação
        approvedBy: Damián Acuña
        approvedAt: 2026-09-29
    depth: []
    blocks:
      - kind: entrada
        entrada:
          id: manifiesto-limite
          type: explanation
          derivedFrom: proposito-del-documento-21
          text:
            es:
              state: aprobado
              text: "El núcleo fija principios, autoridades y criterios; no prescribe herramientas. Llevarlo a un método o a un framework concreto corresponde a anexos y adaptadores separados, que no pueden modificarlo. La [adaptación para SpecKit](/es/speckit) es uno de ellos."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: The core establishes principles, authorities, and criteria; it does not prescribe tools. Bringing it into a specific method or framework is the role of separate annexes and adapters, which must not modify it. The [adaptation for SpecKit](/speckit) is one of them.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: O núcleo estabelece princípios, autoridades e critérios; não prescreve ferramentas. Levá-lo a um método ou framework específico cabe a anexos e adaptadores separados, que não podem modificá-lo. A [adaptação para o SpecKit](/pt-br/speckit) é um deles.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
      - kind: canon
        nodos:
          - proposito-del-documento-21
