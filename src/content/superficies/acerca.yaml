        entrada:
          id: acerca-independencia
          type: surface-text
          text:
            es:
              state: borrador
              text: Software Humano no tiene afiliación con las empresas, herramientas ni autores que lo influyeron. La adaptación a SpecKit es una implementación de referencia independiente, sin respaldo de GitHub.
            en:
              state: borrador
              text: Software Humano has no affiliation with the companies, tools or authors that influenced it. The SpecKit adaptation is an independent reference implementation, not endorsed by GitHub.
            pt-BR:
              state: borrador
              text: A Software Humano não tem afiliação com as empresas, ferramentas nem autores que a influenciaram. A adaptação ao SpecKit é uma implementação de referência independente, sem endosso do GitHub.
