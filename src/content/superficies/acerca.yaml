          type: surface-text
          text:
            es:
              state: aprobado
              text: "El Manifiesto es obra de Damián Acuña. Lo publica y lo cuida **Software Humano**, la agencia que crea productos digitales bajo esta doctrina y acepta ser evaluada con ella. Cada sitio tiene su trabajo: este explica, fundamenta y gobierna; a Software Humano le corresponde presentar su propuesta y sus productos, en su propio sitio. Por eso aquí no hay oferta comercial, y los pasajes del núcleo se leen completos solo en este sitio."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: "Manifiesto is the work of Damián Acuña. It is published and maintained by **Software Humano**, the agency that creates digital products under this doctrine and accepts being evaluated by it. Each site has its role: this one explains, provides the rationale, and governs; Software Humano is responsible for presenting its offering and its products on its own site. That is why there is no commercial offering here, and the core passages can be read in full only on this site."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: "Manifiesto é obra de Damián Acuña. Ele é publicado e mantido pela **Software Humano**, a agência que cria produtos digitais sob esta doutrina e aceita ser avaliada por ela. Cada site tem sua função: este explica, fundamenta e governa; cabe à Software Humano apresentar sua proposta e seus produtos em seu próprio site. Por isso, não há oferta comercial aqui, e as passagens do núcleo só podem ser lidas na íntegra neste site."
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
