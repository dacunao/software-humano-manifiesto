    blocks:
      - kind: entrada
        entrada:
          id: acerca-autoria
          type: surface-text
          text:
            es:
              state: borrador
              text: |-
                El manifiesto y este sitio son obra de Damián Acuña. El texto publicado corresponde al núcleo del manifiesto, versión 2.1, de septiembre de 2026.

                Una versión nueva no reemplaza en silencio a la anterior: se registra qué cambió y se revisan las páginas que dependen de ella.
            en:
              state: borrador
              text: |-
                The manifesto and this site are the work of Damián Acuña. The published text corresponds to version 2.1 of the manifesto core, from September 2026.

                A new version does not silently replace the previous one: what changed is recorded, and the pages that depend on it are reviewed.
            pt-BR:
              state: borrador
              text: |-
                O manifesto e este site são obra de Damián Acuña. O texto publicado corresponde ao núcleo do manifesto, versão 2.1, de setembro de 2026.

                Uma nova versão não substitui silenciosamente a anterior: registra-se o que mudou e revisam-se as páginas que dependem dela.
  - id: software-humano
    title:
      es:
        state: borrador
        text: Software Humano y el Manifiesto
      en:
        state: borrador
        text: Software Humano and Manifiesto
      pt-BR:
        state: borrador
        text: Software Humano e Manifiesto
    blocks:
      - kind: entrada
        entrada:
          id: acerca-software-humano
          type: surface-text
          text:
            es:
              state: borrador
              text: "El Manifiesto es obra de Damián Acuña. Lo publica y lo cuida **Software Humano**, la agencia que crea productos digitales bajo esta doctrina y acepta ser evaluada con ella. Cada sitio tiene su trabajo: este explica, fundamenta y gobierna; a Software Humano le corresponde presentar su propuesta y sus productos, en su propio sitio. Por eso aquí no hay oferta comercial, y los pasajes del núcleo se leen completos solo en este sitio."
            en:
              state: borrador
              text: "Manifiesto is the work of Damián Acuña. It is published and maintained by **Software Humano**, the agency that creates digital products under this doctrine and accepts being evaluated by it. Each site has its role: this one explains, provides the rationale, and governs; Software Humano is responsible for presenting its offering and its products on its own site. That is why there is no commercial offering here, and the core passages can be read in full only on this site."
            pt-BR:
              state: borrador
              text: "Manifiesto é obra de Damián Acuña. Ele é publicado e mantido pela **Software Humano**, a agência que cria produtos digitais sob esta doutrina e aceita ser avaliada por ela. Cada site tem sua função: este explica, fundamenta e governa; cabe à Software Humano apresentar sua proposta e seus produtos em seu próprio site. Por isso, não há oferta comercial aqui, e as passagens do núcleo só podem ser lidas na íntegra neste site."
      - kind: editor
  - id: procedencia
    title:
      es:
        state: borrador
        text: De dónde viene cada texto
      en:
        state: borrador
        text: Where each text comes from
      pt-BR:
        state: borrador
        text: De onde vem cada texto
    blocks:
      - kind: entrada
        entrada:
          id: acerca-procedencia
          type: surface-text
          text:
            es:
              state: borrador
              text: |-
                El sitio distingue y rotula cada clase de contenido. El **texto canónico** se muestra tal como está en el manifiesto. Las **explicaciones**, los **ejemplos** y las **pruebas** se redactan para el sitio a partir de un pasaje identificado, que siempre se puede abrir. Las **traducciones** conservan la referencia al original en español, que es el que tiene autoridad. El **estado técnico** de la adaptación a SpecKit se muestra como un dato verificado, con su versión y su fecha.

                Todo el contenido vive en archivos versionados: cada cambio queda registrado con quién lo aprobó y qué idiomas afecta.
            en:
              state: borrador
              text: |-
                The site distinguishes and labels each class of content. The **canonical text** is shown as it appears in the manifesto. The **explanations**, **examples**, and **tests** are written for the site based on an identified passage, which can always be opened. The **translations** retain the reference to the Spanish original, which is authoritative. The **technical status** of the adaptation to SpecKit is shown as verified data, with its version and date.

                All content lives in versioned files: every change is recorded along with who approved it and which languages it affects.
            pt-BR:
              state: borrador
              text: |-
                O site distingue e rotula cada classe de conteúdo. O **texto canônico** é mostrado como está no manifesto. As **explicações**, os **exemplos** e os **testes** são redigidos para o site a partir de uma passagem identificada, que sempre pode ser aberta. As **traduções** conservam a referência ao original em espanhol, que conserva a autoridade. O **estado técnico** da adaptação ao SpecKit é mostrado como um dado verificado, com sua versão e sua data.

                Todo o conteúdo vive em arquivos versionados: cada alteração fica registrada com quem a aprovou e quais idiomas afeta.
