              state: borrador
              text: Software Humano no tiene afiliación con las empresas, herramientas ni autores que lo influyeron. La adaptación a SpecKit es una implementación de referencia independiente, sin respaldo de GitHub.
            en:
              state: borrador
              text: Software Humano is not affiliated with the companies, tools, or authors that influenced it. The adaptation to SpecKit is an independent reference implementation, without GitHub's endorsement.
            pt-BR:
              state: borrador
              text: A Software Humano não tem afiliação com as empresas, ferramentas nem autores que a influenciaram. A adaptação ao SpecKit é uma implementação de referência independente, sem o respaldo do GitHub.
