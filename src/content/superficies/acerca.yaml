          id: acerca-no-prescribe
          type: surface-text
          derivedFrom: proposito-del-documento-12
          text:
            es:
              state: aprobado
              text: El marco no impone un estilo visual, una tecnología, una estructura única de PRD, una estrategia de entrega ni un framework de ingeniería. Define principios y límites que pueden traducirse a distintos métodos y herramientas sin convertir la estructura interna del sistema en trabajo adicional para la persona.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            en:
              state: aprobado
              text: The framework does not impose a visual style, a technology, a single PRD structure, a delivery strategy, or an engineering framework. It defines principles and boundaries that may be translated into different methods and tools without turning the system's internal structure into additional work for the person.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
            pt-BR:
              state: aprobado
              text: O marco não impõe um estilo visual, uma tecnologia, uma estrutura única de PRD, uma estratégia de entrega nem um framework de engenharia. Define princípios e limites que podem ser traduzidos em diferentes métodos e ferramentas sem transformar a estrutura interna do sistema em trabalho adicional para a pessoa.
              approvedBy: Damián Acuña
              approvedAt: 2026-09-29
