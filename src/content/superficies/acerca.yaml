    blocks:
      - kind: entrada
        entrada:
          id: acerca-influencias
          type: explanation
          derivedFrom: influencias-y-notas-04
          text:
            es:
              state: borrador
              text: "El manifiesto recoge cuatro ideas de Craft: que forma y función van juntas; que una herramienta se mide por la energía y la capacidad que deja en quien la usa; que la complejidad debe aparecer cuando se necesita; y el enfoque *human first*, frente a sistemas que obligan a las personas a acomodarse a su estructura. De Jobs to Be Done conserva el progreso como referencia superior, y de las Job Stories, la forma de llevarlo al diseño: circunstancia, motivación, resultado y evidencia. Fuentes: [Acerca de Craft](https://www.craft.do/es/about); Balint Orosz, [Introducing Craft 3](https://www.craft.do/blog/welcome-to-craft3) (2024) y [Your content is yours and that is more empowering than ever](https://www.craft.do/blog/your-content-is-yours) (2025); Alan Klement, [Designing Features Using Job Stories](https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/) (Intercom, 2013)."
            en:
              state: borrador
              text: "The manifesto draws four ideas from Craft: that form and function go together; that a tool is measured by the energy and capability it leaves its user with; that complexity must appear when it is needed; and the *human first* approach, as opposed to systems that force people to adapt to their structure. From Jobs to Be Done, it retains progress as the highest-order reference, and from Job Stories, the form for bringing it into design: circumstance, motivation, outcome, and evidence. Sources: [About Craft](https://www.craft.do/es/about); Balint Orosz, [Introducing Craft 3](https://www.craft.do/blog/welcome-to-craft3) (2024) and [Your content is yours and that is more empowering than ever](https://www.craft.do/blog/your-content-is-yours) (2025); Alan Klement, [Designing Features Using Job Stories](https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/) (Intercom, 2013)."
            pt-BR:
              state: borrador
              text: "O manifesto reúne quatro ideias do Craft: que forma e função caminham juntas; que uma ferramenta é medida pela energia e pela capacidade que deixa em quem a utiliza; que a complexidade deve aparecer quando é necessária; e a abordagem *human first*, em oposição a sistemas que obrigam as pessoas a se adaptar à sua estrutura. De Jobs to Be Done, conserva o progresso como referência superior e, das Job Stories, a forma de levá-lo ao design: circunstância, motivação, resultado e evidência. Fontes: [Sobre o Craft](https://www.craft.do/es/about); Balint Orosz, [Introducing Craft 3](https://www.craft.do/blog/welcome-to-craft3) (2024) e [Your content is yours and that is more empowering than ever](https://www.craft.do/blog/your-content-is-yours) (2025); Alan Klement, [Designing Features Using Job Stories](https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/) (Intercom, 2013)."
  - id: autoria
    title:
      es:
        state: borrador
