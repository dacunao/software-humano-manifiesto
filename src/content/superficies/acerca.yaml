    blocks:
      - kind: entrada
        entrada:
          id: acerca-influencias
          type: explanation
          derivedFrom: influencias-y-notas-04
          text:
            es:
              state: borrador
              text: "El manifiesto recoge cuatro ideas de Craft: que forma y función van juntas; que una herramienta se mide por la energía y la capacidad que deja en quien la usa; que la complejidad debe aparecer cuando se necesita; y el enfoque *human first*, frente a sistemas que obligan a las personas a acomodarse a su estructura. De Jobs to Be Done conserva el progreso como referencia superior, y de las Job Stories, la forma de llevarlo al diseño: circunstancia, motivación, resultado y evidencia. Fuentes: [Acerca de Craft](https://www.craft.do/es/about); Balint Orosz, [Introducing Craft 3](https://www.craft.do/blog/welcome-to-craft3) (2024) y [Your content is yours and that is more empowering than ever](https://www.craft.do/blog/your-content-is-yours) (2025); Alan Klement, [Designing Features Using Job Stories](https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/) (Intercom, 2013)."
            en:
              state: borrador
              text: "The manifesto takes four ideas from Craft: that form and function belong together; that a tool is measured by the energy and capability it leaves in whoever uses it; that complexity should appear when it is needed; and the *human-first* approach, as against systems that force people to accommodate themselves to their structure. From Jobs to Be Done it retains progress as the higher-level reference, and from Job Stories, the way of carrying that progress into design: circumstance, motivation, outcome and evidence. Sources: [About Craft](https://www.craft.do/es/about); Balint Orosz, [Introducing Craft 3](https://www.craft.do/blog/welcome-to-craft3) (2024) and [Your content is yours and that is more empowering than ever](https://www.craft.do/blog/your-content-is-yours) (2025); Alan Klement, [Designing Features Using Job Stories](https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/) (Intercom, 2013)."
            pt-BR:
              state: borrador
              text: "O manifesto reúne quatro ideias da Craft: que forma e função andam juntas; que uma ferramenta se mede pela energia e pela capacidade que deixa em quem a usa; que a complexidade deve aparecer quando é necessária; e a abordagem *human first*, em contraste com sistemas que obrigam as pessoas a se acomodarem à sua estrutura. De Jobs to Be Done, conserva o progresso como referência superior e, das Job Stories, a forma de levá-lo ao design: circunstância, motivação, resultado e evidência. Fontes: [Sobre a Craft](https://www.craft.do/es/about); Balint Orosz, [Introducing Craft 3](https://www.craft.do/blog/welcome-to-craft3) (2024) e [Your content is yours and that is more empowering than ever](https://www.craft.do/blog/your-content-is-yours) (2025); Alan Klement, [Designing Features Using Job Stories](https://www.intercom.com/blog/using-job-stories-design-features-ui-ux/) (Intercom, 2013)."
  - id: autoria
    title:
      es:
        state: borrador
        text: Autoría y versiones
      en:
        state: borrador
        text: Authorship and versions
      pt-BR:
        state: borrador
        text: Autoria e versões
    blocks:
      - kind: entrada
        entrada:
          id: acerca-autoria
          type: surface-text
          text:
            es:
              state: borrador
              text: |-
                El manifiesto y este sitio son obra de Damián Acuña. El texto publicado corresponde al núcleo del manifiesto, versión 2.1, de septiembre de 2026.

                Una versión nueva no reemplaza en silencio a la anterior: se registra qué cambió y se revisan las páginas que dependen de ella.
            en:
              state: borrador
              text: |-
                The manifesto and this site are the work of Damián Acuña. The published text is the core of the manifesto, version 2.1, dated September 2026.

                A new version does not silently replace the previous one: what changed is recorded, and the pages that depend on it are reviewed.
            pt-BR:
              state: borrador
              text: |-
                O manifesto e este site são obra de Damián Acuña. O texto publicado corresponde ao núcleo do manifesto, versão 2.1, de setembro de 2026.

                Uma versão nova não substitui a anterior em silêncio: registra-se o que mudou e revisam-se as páginas que dependem dela.
  - id: software-humano
    title:
      es:
        state: borrador
        text: Software Humano y el Manifiesto
      en:
        state: borrador
        text: Software Humano and the Manifiesto
      pt-BR:
        state: borrador
        text: Software Humano e o Manifiesto
    blocks:
      - kind: entrada
        entrada:
          id: acerca-software-humano
          type: surface-text
          text:
            es:
              state: borrador
              text: "El Manifiesto es obra de Damián Acuña. Lo publica y lo cuida **Software Humano**, la agencia que crea productos digitales bajo esta doctrina y acepta ser evaluada con ella. Cada sitio tiene su trabajo: este explica, fundamenta y gobierna; a Software Humano le corresponde presentar su propuesta y sus productos, en su propio sitio. Por eso aquí no hay oferta comercial, y los pasajes del núcleo se leen completos solo en este sitio."
            en:
              state: borrador
              text: "The Manifiesto is the work of Damián Acuña. It is published and looked after by **Software Humano**, the agency that creates digital products under this doctrine and accepts being evaluated against it. Each site has its own job: this one explains, grounds and governs; presenting its offering and its products is Software Humano's job, on its own site. That is why there is no commercial offer here, and why the passages of the core can be read in full only on this site."
            pt-BR:
              state: borrador
              text: "O Manifiesto é obra de Damián Acuña. Quem o publica e cuida dele é a **Software Humano**, a agência que cria produtos digitais sob esta doutrina e aceita ser avaliada por ela. Cada site tem sua função: este explica, fundamenta e governa; à Software Humano cabe apresentar sua proposta e seus produtos, em seu próprio site. Por isso, aqui não há oferta comercial, e os trechos do núcleo só podem ser lidos na íntegra neste site."
      - kind: editor
  - id: procedencia
    title:
      es:
        state: borrador
        text: De dónde viene cada texto
      en:
        state: borrador
        text: Where each text comes from
      pt-BR:
        state: borrador
        text: De onde vem cada texto
    blocks:
      - kind: entrada
        entrada:
          id: acerca-procedencia
          type: surface-text
          text:
            es:
              state: borrador
              text: |-
                El sitio distingue y rotula cada clase de contenido. El **texto canónico** se muestra tal como está en el manifiesto. Las **explicaciones**, los **ejemplos** y las **pruebas** se redactan para el sitio a partir de un pasaje identificado, que siempre se puede abrir. Las **traducciones** conservan la referencia al original en español, que es el que tiene autoridad. El **estado técnico** de la adaptación a SpecKit se muestra como un dato verificado, con su versión y su fecha.

                Todo el contenido vive en archivos versionados: cada cambio queda registrado con quién lo aprobó y qué idiomas afecta.
            en:
              state: borrador
              text: |-
                The site distinguishes and labels each kind of content. The **canonical text** is shown exactly as it appears in the manifesto. The **explanations**, **examples** and **tests** are written for the site from an identified passage, which can always be opened. The **translations** keep the reference to the Spanish original, which is the one that holds authority. The **technical status** of the SpecKit adaptation is shown as verified data, with its version and its date.

                All content lives in versioned files: every change is recorded along with who approved it and which languages it affects.
            pt-BR:
              state: borrador
              text: |-
                O site distingue e rotula cada tipo de conteúdo. O **texto canônico** é mostrado tal como está no manifesto. As **explicações**, os **exemplos** e os **testes** são redigidos para o site a partir de um trecho identificado, que sempre pode ser aberto. As **traduções** mantêm a referência ao original em espanhol, que é o que tem autoridade. O **status técnico** da adaptação ao SpecKit é mostrado como um dado verificado, com sua versão e sua data.

                Todo o conteúdo vive em arquivos versionados: cada mudança fica registrada com quem a aprovou e que idiomas ela afeta.
