    - { id: ecra, patron: '\becrã', motivo: 'forma de Portugal; en Brasil, «tela»' }
    - { id: ficheiro, patron: 'ficheiro', motivo: 'forma de Portugal; en Brasil, «arquivo»' }
    - { id: registo, patron: '\bregistos?\b', motivo: 'forma de Portugal; en Brasil, «registro»' }
    - { id: estar-a, patron: '\b(est[aáo]\w*|fic\w+) a (fazer|usar|ler|ver|construir|trabalhar|escrever)\b', motivo: 'construcción de Portugal; en Brasil, gerundio' }
