  # Nombres de los principios, iguales en el núcleo y en el copy.
  - { id: P01, es: 'progreso del usuario es la unidad de diseño', en: "user's progress is the unit of design", pt: 'progresso da pessoa é a unidade de design' }
  - { id: P02, es: 'experiencia también es funcionalidad', en: 'experience is also functionality', pt: 'experiência também é funcionalidade' }
  - { id: P03, es: 'complejidad pertenece al sistema', en: 'complexity belongs to the system', pt: 'complexidade pertence ao sistema' }
  - { id: P04, es: 'simple al comenzar y profundo al necesitarlo', en: 'simple to begin with, deep when needed', pt: 'simples no começo e profundo quando necessário' }
  - { id: P05, es: 'interfaz no debe convertirse en otra tarea', en: 'interface must not become another task', pt: 'interface não deve se tornar outra tarefa' }
  - { id: P06, es: 'atención es un recurso del producto', en: 'attention is a product resource', pt: 'atenção é um recurso do produto' }
  - { id: P07, es: 'confianza se diseña', en: 'trust is designed', pt: 'confiança é projetada' }
  - { id: P08, es: 'calidad vive en la acumulación de detalles', en: 'quality lives in the accumulation of details', pt: 'qualidade vive no acúmulo de detalhes' }
  - { id: P09, es: 'tiempo y la continuidad forman parte de la interfaz', en: 'time and continuity are part of the interface', pt: 'tempo e a continuidade fazem parte da interface' }
  - { id: P10, es: 'persona conserva control y propiedad', en: 'person retains control and ownership', pt: 'pessoa conserva controle e propriedade' }
prohibidos:
  en:
    - { id: confidence, patron: '\bconfidence\b(?! level)', motivo: '«confianza» es «trust» (corrección del 2026-09-28)', salvoSiEs: 'nivel de confianza|seguridad en s[ií]' }
    - { id: releases, patron: '\breleases?\b', motivo: '«entregas» es «deliveries»; «releases» es un concepto que el núcleo declara no obligatorio', salvoSiEs: '\breleases?\b|liberar|liberaci' }
    - { id: prioritise, patron: '\bprioriti[sz]', motivo: '«jerarquizar» no es priorizar; el núcleo excluye la prioridad', salvoSiEs: 'prioridad|priorizar' }
