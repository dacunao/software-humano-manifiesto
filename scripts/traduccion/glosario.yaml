# Capa 1 · Glosario español → inglés → portugués de Brasil (T182, RQ-19).
# Fuente: el núcleo aprobado por Damián Acuña el 2026-09-28, con sus correcciones de ese día.
# El español es la referencia. Expresiones regulares sin distinguir mayúsculas.
# - es: cuándo aplica el término; en / pt: lo que la traducción debe contener.
# - prohibidos: variantes que no deben aparecer; `salvoSiEs` las permite si el español las justifica.
